name: Recursos de la app
# Baja fuentes, librerías, iconos e imágenes a assets/ para que la app no dependa de otros servidores.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/workflows/recursos.yml','tareas/recursos.py','tareas/recursos.json']
permissions:
  contents: write
concurrency: recursos
jobs:
  recursos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pillow
      - run: python3 tareas/recursos.py
      - run: |
          git config user.name "Recursos"; git config user.email "actions@users.noreply.github.com"
          git add -A assets && (git diff --cached --quiet || (git commit -m "Recursos de la app (fuentes, iconos, imágenes)" && git pull --rebase && git push))
