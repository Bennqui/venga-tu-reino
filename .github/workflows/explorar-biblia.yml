name: Explorar Biblia (temporal)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/explorar-biblia.yml']
jobs:
  x:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          echo "== helloao =="; curl -sL --max-time 60 https://bible.helloao.org/api/available_translations.json | python3 -c "import json,sys;d=json.load(sys.stdin);[print(t['id'],'|',t.get('name'),'|',t.get('englishName'),'|',t.get('licenseUrl')) for t in d['translations'] if t.get('language')=='spa']" || true
          echo "== ebible =="; curl -sL --max-time 60 https://ebible.org/Scriptures/translations.csv | grep -i "spa\|spanish\|españ" | cut -c1-300 || true
          echo "== crosswire =="; curl -sL --max-time 60 "https://www.crosswire.org/sword/modules/ModDisp.jsp?modType=Bibles" | grep -io "Spa[A-Za-z0-9]*[^<]\{0,120\}" | head -40 || true
