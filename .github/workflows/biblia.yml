name: Biblia católica de dominio público
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/workflows/biblia.yml','tareas/biblia.py','tareas/moderno.py']
permissions:
  contents: write
jobs:
  biblia:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          # Biblia Platense (Mons. Juan Straubinger), módulo SpaPlatense de CrossWire, dominio público.
          curl -fsSL --max-time 180 https://raw.githubusercontent.com/scrollmapper/bible_databases/59b18c5af5845728c275d5b7178ad0d024172b1f/formats/json/SpaPlatense.json -o platense.json
          rm -f biblia/*.json
          python3 tareas/biblia.py platense.json biblia
          rm -f platense.json
          git config user.name "Biblia"; git config user.email "actions@users.noreply.github.com"
          git add -A biblia && (git diff --cached --quiet || (git commit -m "Biblia católica de dominio público para las lecturas" && git push))
