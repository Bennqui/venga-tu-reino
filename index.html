<style>
/* Diseño «Crepúsculo de Barquisimeto»: lo único llamativo es el cielo de la portada, que cambia con la hora
   y lleva el color litúrgico del día. Todo lo demás es tranquilo: fondo de cal fría, tinta índigo, oro discreto.
   Marcellus (letra de inscripción romana) para títulos; Literata (hecha para leer en pantalla) para el texto. */
:root{--bg:#FFFFFF;--card:#FFFFFF;--ink:#2A2316;--mut:#7A6D55;--line:#EFE7D6;--soft:#FAF6EC;--gold:#9C700A;--gold-bg:#FDF4D6;--wine:#E1AE1E;--on-wine:#2A2316;--ok:#2E7A4F;--bad:#B3302F;--lit:#C9960F;--litc:#C9960F;--tint:#FBF5E6;--vy:#E1AE1E;--vw:#FFFFFF;--red:#B0182A;--red-bg:#FBEDEE;--fd:'Marcellus','Trajan Pro',Georgia,serif;--fb:'Literata',Georgia,'Times New Roman',serif;--r:20px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:17px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:12px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
#app{max-width:620px;margin:0 auto}
h1,h2,h3{font-family:var(--fd);font-weight:400;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:1.45rem;margin:26px 0 8px}
h3{font-size:1.15rem;margin:16px 0 4px}
p{margin:6px 0}
a{color:var(--ink);text-decoration-color:var(--gold);text-underline-offset:3px}
.mut{color:var(--mut)}
.small{font-size:.88rem}
/* Cabecera compacta (otras pestañas) */
.hd.c{display:flex;gap:12px;align-items:center;padding:6px 2px 10px;border-bottom:1px solid var(--line);margin-bottom:6px;line-height:1.3}
.hd.c b{font-family:var(--fd);font-weight:400;font-size:1.05rem}
/* Portada */
.hero{position:relative;border-radius:28px;overflow:hidden;color:#fff;margin:2px 0 14px;min-height:370px;isolation:isolate;text-shadow:0 1px 12px rgba(10,10,40,.35)}
.hero.day{color:#1F2140;text-shadow:0 1px 10px rgba(255,255,255,.5)}
.hero.day .pill{background:rgba(255,255,255,.55)}
.hero svg.sky{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero .ht{padding:56px 22px 0}
.hero .when{font-size:.92rem;opacity:.92}
.hero .frase{font-family:var(--fd);font-size:1.6rem;line-height:1.25;margin:6px 0 6px;text-wrap:balance}
.hero .cita{font-size:.92rem;opacity:.9}
.hero .top{position:absolute;top:14px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;font-size:.85rem}
.hero .brand{font-family:var(--fd);font-size:1.05rem;letter-spacing:.04em}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.18);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;padding:3px 11px;border-radius:999px;background:var(--soft);color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--litc);display:inline-block;box-shadow:0 0 0 2px color-mix(in srgb,var(--lit) 25%,transparent)}
/* Superficies: una sola tarjeta blanca sin sombra; lo secundario va sobre el fondo */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:12px 0}
.card.tint{background:transparent;border:0;border-left:3px solid var(--lit);border-radius:0;padding:4px 0 4px 14px}
.card h3:first-child{margin-top:0}
.seg{display:flex;gap:4px;overflow-x:auto;padding:4px;margin:10px 0 8px;scrollbar-width:none;background:var(--soft);border-radius:999px}
.seg::-webkit-scrollbar{display:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.seg button{flex:none;min-height:40px;padding:6px 15px;border-radius:999px;border:0;background:transparent;font-size:.92rem;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(20,22,50,.12)}
.btn{min-height:48px;padding:10px 20px;border-radius:999px;border:1.5px solid var(--wine);background:var(--wine);color:var(--on-wine);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.big{width:100%;min-height:56px;font-size:1.05rem}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
details{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:8px 0}
summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:12px;min-height:52px;font-weight:600}
summary::-webkit-details-marker{display:none}
summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:1.5px solid var(--mut);border-bottom:1.5px solid var(--mut);transform:rotate(45deg);transition:transform .2s;flex:none}
details[open]>summary::after{transform:rotate(-135deg)}
details .in{padding:0 16px 16px}
.num{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;font-family:var(--fd)}
.sec{font-family:var(--fd);font-weight:400;font-size:1.35rem;margin:30px 2px 6px;color:var(--ink)}
.say{border-left:3px solid var(--gold);background:var(--gold-bg);padding:10px 14px;border-radius:0 14px 14px 0;margin:10px 0}
.say b{font-size:.84rem;color:var(--gold);display:block;font-weight:600}
.lbl{font-size:.88rem;font-weight:600;color:var(--gold);margin:14px 0 2px}
.prayer{font-family:var(--fb);font-size:1.06rem;line-height:1.75;white-space:pre-line}
.opt{display:block;width:100%;text-align:left;min-height:50px;margin:8px 0;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.q{font-family:var(--fd);font-size:1.3rem;line-height:1.35;margin:6px 0 10px}
.bar{height:6px;background:var(--soft);border-radius:4px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--lit)}
.chk{display:flex;gap:12px;align-items:flex-start;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer;min-height:50px}
.chk:last-child{border-bottom:0}
.chk input{width:22px;height:22px;margin-top:3px;flex:none;accent-color:var(--lit)}
.chk .t{font-size:.84rem;color:var(--mut)}
textarea{width:100%;min-height:90px;resize:vertical;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--bg);color:var(--ink);font:inherit;margin-top:6px}
ul.tight{margin:6px 0;padding-left:20px}
ul.tight li{margin:5px 0}
table.dates{width:100%;border-collapse:collapse;font-size:.96rem}
table.dates td{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.dates td:first-child{white-space:nowrap;padding-right:12px;color:var(--gold);font-weight:600}
.sw{width:18px;height:18px;border-radius:50%;flex:none;margin-top:4px}
.colrow{display:flex;gap:12px;align-items:flex-start;margin:8px 0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));z-index:5}
nav.tabs .in{max-width:620px;margin:0 auto;display:flex}
nav.tabs button{flex:1;background:none;border:0;padding:7px 2px 5px;min-height:58px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;color:var(--mut);font-family:var(--fb)}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:600}
nav.tabs button[aria-current="page"] svg{stroke:var(--lit);stroke-width:2}
.note{font-size:.86rem;color:var(--mut);margin:12px 2px}
/* Iconos de línea */
.ic{width:44px;height:44px;stroke:var(--lit);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:28px;height:28px}
/* Atajos del día */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 10px;text-align:left;min-height:104px;display:flex;flex-direction:column;gap:6px;font-size:.86rem;line-height:1.3}
.tile b{font-family:var(--fd);font-weight:400;font-size:1rem}
/* Racha */
.streak{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 0}
.streak .small{white-space:nowrap}
.week{display:flex;gap:6px}
.week span{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--mut)}
.week span.on{background:var(--lit);border-color:var(--lit);color:#fff}
.week span.today{border:1.5px solid var(--ink)}
/* Modo oración paso a paso */
.pager{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:22px 20px 18px;margin:10px 0;min-height:420px;display:flex;flex-direction:column}
.pager .ph{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:var(--line);min-height:0}
.dots button.on{background:var(--lit);width:26px;border-radius:6px}
.dots button.done{background:color-mix(in srgb,var(--lit) 45%,var(--line))}
.pager h2{margin:14px 0 6px;font-size:1.6rem}
.pager .pb{flex:1}
.pager .pn{display:flex;gap:8px;margin-top:16px}
.pager .pn .btn{flex:1}
.fin{text-align:center;padding:10px 0}
.fin .ic{width:72px;height:72px}
.reading p{font-size:1.05rem;line-height:1.75}
.reading p:first-of-type::first-letter{font-family:var(--fd);font-size:3.1em;float:left;line-height:.9;padding:6px 8px 0 0;color:var(--lit)}
@media (prefers-reduced-motion:no-preference){.pager .pb{animation:pin .35s ease-out}@keyframes pin{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}}
@media (prefers-reduced-motion:reduce){summary::after{transition:none}}
/* ===== Misa simple, Rosario guiado, Apóstol ===== */
.cita{font-size:.88rem;color:var(--mut)}
.say .prayer{display:block}
.say.big .prayer{font-size:1.12rem}
.cue{font-size:.92rem;color:var(--mut);margin:10px 0 2px;line-height:1.45}
.cue span{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-right:6px}
.lecc{margin-top:8px}.lecc summary{cursor:pointer;color:var(--gold);font-weight:600;font-size:.9rem;list-style:none;padding:6px 0}.lecc summary::-webkit-details-marker{display:none}.lectxt{font-family:Georgia,serif;font-size:1.02rem;line-height:1.6;animation:lecIn .3s ease}@keyframes lecIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.lectxt sup{color:var(--gold);font-size:.68em;font-family:system-ui}
.hoyb{background:var(--tint);border-radius:14px;padding:10px 14px;margin:10px 0}
.hoyb>b{display:block;font-size:.84rem;color:var(--gold);font-weight:600}
.hoyb p{margin:4px 0 0}
.hoyb.par{border-left:3px solid var(--lit)}
.nota{border:1.5px solid var(--gold);background:var(--gold-bg);border-radius:14px;padding:10px 14px;margin:10px 0}
.nota>b{display:block;font-size:.84rem;color:var(--gold)}
ul.hoyl{list-style:none;padding:0;margin:10px 0 4px;display:flex;flex-wrap:wrap;gap:6px}
ul.hoyl li{font-size:.84rem;padding:3px 11px;border-radius:999px;background:var(--soft)}
ul.hoyl li i{font-style:normal;margin-right:5px;color:var(--ok)}
ul.hoyl li.n{opacity:.6}
ul.hoyl li.n i{color:var(--mut)}
.gnav{display:flex;gap:8px;margin:10px 0 14px}
.gnav .btn{flex:1}
.gsel{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--card);color:var(--ink);font:inherit;margin:6px 0}
details.mini{background:transparent;border:0;margin:6px 0 0}
details.mini>summary{min-height:40px;padding:6px 0;font-weight:400;color:var(--mut);font-size:.92rem}
details.mini .in{padding:0 0 8px}
.resp{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:8px 0}
.resp .rh{display:flex;align-items:center;gap:10px;line-height:1.3}
.resp .rh b{font-weight:600}
.resp .pos{margin-left:auto;font-size:.76rem;color:var(--mut);text-align:right}
.resp .say{margin:8px 0 0}
.lk{background:none;border:0;color:var(--mut);font-size:.86rem;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.card.imp h2{margin:4px 0 8px}
/* Rosario */
.rmap{display:block;width:190px;height:auto;margin:0 auto 4px}
.rmap .ch{fill:none;stroke:var(--mut);stroke-width:1;opacity:.5}
.rmap .b{fill:var(--soft);stroke:var(--mut);stroke-width:1.1}
.rmap .b.d{fill:color-mix(in srgb,var(--lit) 55%,var(--card));stroke:var(--lit)}
.rmap .b.a{fill:var(--gold);stroke:var(--gold)}
.rmap .ring{fill:none;stroke:var(--gold);stroke-width:2;opacity:.7}
.rmap .cx{stroke:var(--mut);stroke-width:3;stroke-linecap:round}
.rmap .cx.d{stroke:var(--lit)}
.rmap .cx.a{stroke:var(--gold)}
.where{display:inline-flex;align-items:center;gap:6px;font-size:.86rem;padding:4px 12px;border-radius:999px;background:var(--gold-bg);color:var(--ink);margin:2px 0 6px}
.beads{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0 8px}
.beads i{width:22px;height:22px;border-radius:50%;border:2px solid var(--lit);display:inline-block}
.beads i.on{background:var(--lit)}
.tap{width:100%;min-height:84px;border-radius:22px;border:2px dashed var(--lit);background:var(--tint);color:var(--ink);font-size:1.08rem;font-weight:600;margin:4px 0}
.tap.ok{border-style:solid;background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.pick button{min-height:54px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);text-align:left;padding:8px 12px;line-height:1.25}
.pick button[aria-pressed="true"]{border-color:var(--lit);background:var(--tint)}

/* ===== Diseño 2 (nov 2026) ===== */
/* ===== Diseño 2 (nov 2026): base común — espaciado de 4 en 4, cinco tamaños de letra, radios 12/16/28,
   una sola sombra suave, un acento (oro) y movimiento con tres duraciones: 120 ms, 240 ms y 400 ms. ===== */
:root{--e:cubic-bezier(.2,.8,.2,1);--t1:120ms;--t2:240ms;--t3:400ms;--sh:0 4px 16px rgba(42,35,22,.06);--r:16px;--soft:#F7F4EE;--tint:#F7F4EE;--line:#ECE5D6}
html[data-theme=dark]{--soft:#221D16;--tint:#221D16;--sh:none}
@media (prefers-color-scheme:dark){html[data-theme=auto]{--soft:#221D16;--tint:#221D16;--sh:none}}
/* Tarjetas: un radio, borde fino y sombra muy suave */
.card,.cono,.novnow,.hoyb{border-radius:16px}
.card{border:1px solid var(--line);box-shadow:var(--sh)}
.hoyb{background:var(--soft);border:0}
.tint{border-left-color:var(--gold)}
/* Botones: principal (oro), secundario (contorno) y de texto; nada más */
.btn{border-radius:14px;min-height:48px;padding:10px 18px;font-weight:600;letter-spacing:.01em;transition:transform var(--t1) var(--e),background-color var(--t2),border-color var(--t2),color var(--t2)}
.btn.ghost{border:1.5px solid var(--line);background:transparent;color:var(--ink)}
.btn:active,.seg button:active,nav.tabs button:active,.card[data-act]:active,.novnow:active{transform:scale(.97)}
.btn.ico{flex:0 0 56px;min-width:56px;padding:0}
.btn.ico svg,.ib svg,#offp svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
/* Píldoras de secciones: activa en blanco con sombra (no en amarillo); la sección hermana con flecha */
.seg{background:var(--soft);padding:4px;gap:2px}
.seg button{min-height:38px;font-size:.9rem;transition:background-color var(--t2) var(--e),color var(--t2),box-shadow var(--t2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(42,35,22,.12)}
.seg button.sib{color:var(--gold);font-weight:600;margin-left:6px;position:relative}
.seg button.sib::before{content:"";position:absolute;left:-4px;top:9px;bottom:9px;width:1px;background:var(--line)}
.seg.more{-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
.grp{display:none}
/* Menos amarillo: el oro queda como acento, no como fondo */
.chip{background:var(--soft)}
.aviso,.nota,.note.tint{background:transparent}
/* Portada: la frase entra palabra por palabra; el crédito de la imagen aparece al tocar «i» */
.ph .wd{display:inline-block;animation:wd var(--t3) var(--e) both;animation-delay:calc(140ms + var(--i)*45ms)}

.ph .pi img{transition:filter .6s var(--e)}
.ph .pi img:not(.ok){filter:blur(18px) saturate(1.1)}

.cimg{margin:14px 0 6px;border-radius:16px;overflow:hidden;background:var(--soft)}
.cimg img{display:block;width:100%;max-height:420px;object-fit:cover;opacity:0;transition:opacity var(--t3) var(--e)}

html[data-vt=r]html[data-vt=r]html[data-vt=l]html[data-vt=l]/* Misa a pantalla completa: letra más grande, sin barra de abajo; se avanza deslizando */

/* Corona de Adviento */
.corona{position:relative;margin:14px 0;padding:18px 18px 16px;border-radius:24px;color:#FBEFD6;overflow:hidden;background:radial-gradient(120% 90% at 50% 18%,#3A2611 0%,#22160A 55%,#140D06 100%);box-shadow:0 14px 34px rgba(30,18,6,.28)}

@keyframes halo{0%,100%{opacity:.85}50%{opacity:.6}}
/* Vela del día */
.velad{display:flex;align-items:center;gap:14px;margin:12px 0;padding:12px 16px;border-radius:18px;background:linear-gradient(135deg,#FFF8E6,#FCEFD0);border:1px solid #F1DFAF}

.angelus{margin:12px 0;border-radius:20px;border:1px solid #EBD9A8;background:linear-gradient(160deg,#FFFBEF,#FBF1D6);padding:14px 16px}

/* Rosario: custodia con la pintura del misterio */
.rcus{position:relative;width:170px;height:170px;margin:8px auto 14px}
.rcus::before{content:"";position:absolute;inset:-26px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(225,174,30,.85) 0 1.6deg,transparent 1.6deg 11.25deg);-webkit-mask:radial-gradient(circle,transparent 52%,#000 55%,transparent 72%);mask:radial-gradient(circle,transparent 52%,#000 55%,transparent 72%);animation:rgira 40s linear infinite}

/* ===== Diseño 4: finales de pestaña, buscador, bienvenida, modo oscuro y accesibilidad ===== */
.cierre{position:relative;margin:40px calc(50% - 50vw) 0;min-height:min(78vh,640px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 28px calc(110px + env(safe-area-inset-bottom,0px));text-align:center;color:#FBEFD6;overflow:hidden;background:radial-gradient(110% 80% at 50% 40%,#2C1F0B 0%,#160F06 62%,#0D0904 100%)}

(function(){

/* ===== UTILIDADES ===== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mem={};
const store={
  get(k,d){try{const v=localStorage.getItem('elm:'+k);if(v!=null)return JSON.parse(v)}catch(e){}return (k in mem)?mem[k]:d},
  set(k,v){mem[k]=v;try{localStorage.setItem('elm:'+k,JSON.stringify(v))}catch(e){}}

const pad=n=>String(n).padStart(2,'0');

const fmt=d=>DIAS[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()];
const fmtCorto=d=>d.getDate()+' '+MESES[d.getMonth()].slice(0,3);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const TTS=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);

/* ===== CALENDARIO LITÚRGICO (calculado) ===== */
function easter(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
  h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
  mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  return new Date(y,mo-1,da);
}
function adventStart(y){const x=new Date(y,11,24);x.setDate(24-x.getDay());return addDays(x,-21)}
function baptism(y){const j=new Date(y,0,6);return addDays(j,7-j.getDay())}
function cicloDom(d){const y=d.getFullYear();const Y=d>=adventStart(y)?y:y-1;return 'ABC'[Y%3]}

/* Solemnidades de fecha fija que caen en un domingo de Adviento o Cuaresma, en Semana Santa o en la Octava de Pascua:
   no se celebran ese día y se trasladan (Normas universales sobre el Año litúrgico, n. 60). */
function trasladosFijos(y){
  const E=easter(y),palm=addDays(E,-7),oct2=addDays(E,7),ash=addDays(E,-46),T={},quita={};
  const domCuaresma=d=>d.getDay()===0&&diff(d,ash)>0&&diff(d,palm)<0;
  const j=new Date(y,2,19);
  if(diff(j,palm)>=0&&diff(j,E)<0){quita[ymd(j)]=1;T[ymd(addDays(palm,-1))]=[3,19]}
  else if(domCuaresma(j)){quita[ymd(j)]=1;T[ymd(addDays(j,1))]=[3,19]}
  const a=new Date(y,2,25);
  if(diff(a,palm)>=0&&diff(a,oct2)<=0){quita[ymd(a)]=1;T[ymd(addDays(oct2,1))]=[3,25]}
  else if(domCuaresma(a)){quita[ymd(a)]=1;T[ymd(addDays(a,1))]=[3,25]}
  const i=new Date(y,11,8);
  if(i.getDay()===0){quita[ymd(i)]=1;T[ymd(addDays(i,1))]=[12,8]}
  return {T,quita};
}
/* Fecha real (con traslado) de una celebración fija en el año y */
function fechaReal(y,m,dd){const {T}=trasladosFijos(y);for(const k in T)if(T[k][0]===m&&T[k][1]===dd){const q=k.split('-').map(Number);return new Date(q[0],q[1]-1,q[2])}return new Date(y,m-1,dd)}
function fijaDe(d){
  const {T,quita}=trasladosFijos(d.getFullYear()),key=ymd(d);
  if(T[key]){const f=FIJAS.find(x=>x[0]===T[key][0]&&x[1]===T[key][1]);return f?{f,tras:true}:null}
  if(quita[key])return null;
  const f=FIJAS.find(x=>x[0]===d.getMonth()+1&&x[1]===d.getDate());return f?{f,tras:false}:null;
}
function rangoDe(g){return /Solemnidad/.test(g)?'Solemnidad':/Fiesta/.test(g)?'Fiesta':/Memoria/.test(g)?'Memoria':''}

function liturgia(d){
  d=new Date(d.getFullYear(),d.getMonth(),d.getDate());   /* solo la fecha: la hora del teléfono no debe cambiar el día litúrgico */
  const y=d.getFullYear(),E=easter(y),ash=addDays(E,-46),pent=addDays(E,49),adv=adventStart(y),bap=baptism(y),ck=addDays(adv,-7);
  const wd=d.getDay(),nm=cap(DIAS[wd]),k=diff(d,E);
  let r;
  if(d>=new Date(y,11,25)){
    const dd=d.getDate();let sf=30;for(let x=26;x<=31;x++)if(new Date(y,11,x).getDay()===0)sf=x;
    r={tiempo:'Navidad',color:'blanco',octava:true};
    if(dd===25){r.titulo='Natividad del Señor (Navidad)';r.rango='Solemnidad'}
    else if(dd===sf){r.titulo='Sagrada Familia de Jesús, María y José';r.rango='Fiesta'}
    else if(dd===26){r.titulo='San Esteban, protomártir';r.rango='Fiesta';r.color='rojo'}
    else if(dd===27){r.titulo='San Juan, apóstol y evangelista';r.rango='Fiesta'}
    else if(dd===28){r.titulo='Santos Inocentes, mártires';r.rango='Fiesta';r.color='rojo'}
    else r.titulo=nm+' de la Octava de Navidad';
  }else if(d<=bap){
    r={tiempo:'Navidad',color:'blanco',titulo:nm+' del tiempo de Navidad'};
    if(d.getMonth()===0&&d.getDate()===1){r.titulo='Santa María, Madre de Dios';r.octava=true}
    else if(ymd(d)===ymd(bap)){r.titulo='Bautismo del Señor';r.rango='Fiesta'}
    else if(d.getMonth()===0&&d.getDate()===6)r.titulo='Epifanía del Señor';
    else if(wd===0&&d.getDate()<=5)r.titulo='Domingo II de Navidad';
  }else if(d>=adv){
    const w=Math.floor(diff(d,adv)/7)+1;
    r={tiempo:'Adviento',color:'morado',semana:w};
    if(wd===0){r.titulo='Domingo '+ROM[w]+' de Adviento';if(w===3){r.color='rosa';r.nota='Domingo Gaudete («alégrense»): se puede usar el color rosa.'}}
    else if(d.getMonth()===11&&d.getDate()>=17)r.titulo=nm+' '+d.getDate()+' de diciembre, preparación inmediata a la Navidad';
    else r.titulo=nm+' de la semana '+w+' de Adviento';
  }else if(d<ash){
    const s=addDays(d,-wd),N=Math.round(diff(s,bap)/7)+1;
    r={tiempo:'Tiempo Ordinario',color:'verde',semana:N,titulo:(wd===0?'Domingo '+(N)+' del Tiempo Ordinario':nm+' de la semana '+N+' del Tiempo Ordinario')};
  }else if(k<-3){
    r={tiempo:'Cuaresma',color:'morado'};

    else if(k>=-6){r.titulo=nm+' Santo';r.semana=0}
    else{
      const s=addDays(d,-wd),w=Math.round(diff(s,first)/7)+1;r.semana=w;
      if(wd===0){r.titulo='Domingo '+ROM[w]+' de Cuaresma';if(w===4){r.color='rosa';r.nota='Domingo Laetare («alégrate»): se puede usar el color rosa.'}}
      else r.titulo=nm+' de la semana '+w+' de Cuaresma';
    }
  }else if(k<0){
    r={tiempo:'Triduo Pascual',color:'blanco'};
    if(k===-3){r.titulo='Jueves Santo, Misa de la Cena del Señor';r.nota='Hasta la Misa de la tarde sigue la Cuaresma; con esa Misa empieza el Triduo Pascual.'}
    else if(k===-2){r.titulo='Viernes Santo, Pasión del Señor';r.color='rojo';r.nota='Hoy no se celebra la Misa: hay celebración de la Pasión, con adoración de la cruz y comunión. Día de ayuno y abstinencia.'}
    else{r.titulo='Sábado Santo';r.color='morado';r.nota='Hoy no se celebra Misa durante el día: la Iglesia acompaña a Jesús en el sepulcro. Por la noche, la Vigilia Pascual ya es la celebración de la Pascua.'}
  }else if(d<=pent){
    r={tiempo:'Pascua',color:'blanco'};
    if(k<=7)r.octava=true;
    if(k===0){r.titulo='Domingo de Pascua de la Resurrección del Señor';r.rango='Solemnidad'}
    else if(k<7)r.titulo=nm+' de la Octava de Pascua';
    else if(k===49){r.titulo='Domingo de Pentecostés';r.color='rojo';r.rango='Solemnidad'}
    else if(k===42){r.titulo='Ascensión del Señor';r.rango='Solemnidad';r.nota='En Venezuela la Ascensión no se celebra el jueves sino este domingo, el VII de Pascua.'}
    else if(wd===0){r.titulo='Domingo '+ROM[k/7+1]+' de Pascua';if(k===7)r.nota='Domingo de la Divina Misericordia.'}
    else r.titulo=nm+' de la semana '+(Math.floor(k/7)+1)+' de Pascua';
  }else{
    const s=addDays(d,-wd),N=34-Math.round(diff(ck,s)/7);
    r={tiempo:'Tiempo Ordinario',color:'verde',semana:N};
    const ord=(wd===0?'Domingo '+N+' del Tiempo Ordinario':nm+' de la semana '+N+' del Tiempo Ordinario');
    if(ymd(d)===ymd(ck)){r.titulo='Jesucristo, Rey del Universo';r.color='blanco';r.rango='Solemnidad'}
    else if(k===50){r.titulo='Santa María, Madre de la Iglesia';r.color='blanco';r.rango='Memoria';r.nota='Lunes después de Pentecostés.'}
    else if(k===56){r.titulo='Santísima Trinidad';r.color='blanco';r.rango='Solemnidad'}
    else if(k===63){r.titulo='Santísimo Cuerpo y Sangre de Cristo (Corpus Christi)';r.color='blanco';r.rango='Solemnidad';r.nota='En Venezuela el Corpus Christi no se celebra el jueves sino este domingo.'}
    else if(k===68){r.titulo='Sagrado Corazón de Jesús';r.color='blanco';r.rango='Solemnidad'}
    else if(k===69){r.titulo='Inmaculado Corazón de la Virgen María';r.color='blanco';r.rango='Memoria'}
    else r.titulo=ord;
  }
  if(r.tiempo!=='Triduo Pascual'&&!(k>=-7&&k<0)&&!(r.rango==='Solemnidad')){
    const F=fijaDe(d);
    if(F){
      const f=F.f,g=f[3],sol=/Solemnidad|Conmemoración/.test(g),senor=f[0]===2&&f[1]===2;
      const domPriv=wd===0&&/Adviento|Cuaresma|Pascua/.test(r.tiempo);
      const cabe=!domPriv&&(wd!==0||sol||senor||r.tiempo==='Navidad');
      if(cabe){
        r.especial={n:f[2],g:g,d:f[4]+(F.tras?' Este año se celebra hoy porque su fecha propia coincidió con un día litúrgico de mayor rango.':'')};
        r.color=COL_FIJA[f[0]+'-'+f[1]]||'blanco';r.titulo=f[2];r.rango=rangoDe(g)||r.rango;
      }else r.nota=(r.nota?r.nota+' ':'')+'Hoy también se recuerda: '+f[2]+'.';
    }
  }

}
function fechasAnio(y){
  const E=easter(y),adv=adventStart(y);
  const L=[
    [addDays(E,-46),'Miércoles de Ceniza','Comienza la Cuaresma. Día de ayuno y abstinencia. Se impone la ceniza.'],
    [addDays(E,-7),'Domingo de Ramos','Jesús entra en Jerusalén. Se lee la Pasión.'],
    [addDays(E,-3),'Jueves Santo','Misa de la Cena del Señor: Jesús instituye la Eucaristía y el sacerdocio, y lava los pies de sus discípulos.'],
    [addDays(E,-2),'Viernes Santo','Pasión del Señor. No se celebra Misa: se adora la cruz y se puede comulgar. Ayuno y abstinencia.'],
    [addDays(E,-1),'Sábado Santo y Vigilia Pascual','Durante el día no hay Misa. Por la noche, la Vigilia Pascual: fuego nuevo, cirio pascual, lecturas, bautismos y la primera Misa de Pascua.'],
    [E,'Domingo de Pascua','Resurrección del Señor, centro de la fe cristiana.'],
    [addDays(E,42),'Ascensión del Señor','En Venezuela se celebra el VII domingo de Pascua (en otros países, el jueves anterior, 40 días después de Pascua).'],
    [addDays(E,49),'Pentecostés','Venida del Espíritu Santo sobre los apóstoles; termina el tiempo pascual.'],
    [addDays(E,56),'Santísima Trinidad','Celebramos a Dios Padre, Hijo y Espíritu Santo.'],
    [addDays(E,63),'Corpus Christi','Cuerpo y Sangre de Cristo: fiesta de la Eucaristía. En Venezuela se celebra el domingo después de la Santísima Trinidad.'],
    [addDays(E,68),'Sagrado Corazón de Jesús','Viernes: el amor de Cristo por todos.'],
    [addDays(adv,-7),'Cristo Rey del Universo','Último domingo del año litúrgico.'],
    [adv,'1.er domingo de Adviento','Comienza el año litúrgico. Ciclo '+'ABC'[y%3]+' para los domingos.']
  ];
  FIJAS.forEach(f=>L.push([fechaReal(y,f[0],f[1]),f[2],f[4]]));
  return L.sort((a,b)=>a[0]-b[0]);
}
function litColor(c){
  const dark=false;
  const L=dark?{verde:'#5FAE75',morado:'#A184D6',blanco:'#E0C06A',rojo:'#E0606A',rosa:'#E391AC'}:{verde:'#3F7D4E',morado:'#6B3FA0',blanco:'#C9A24A',rojo:'#B3262E',rosa:'#D27C9A'};
  return L[c]||L.verde;
}

/* ===== ESTADO ===== */
const state={
  tab:store.get('tab','hoy'),
  sub:Object.assign({enc:'paso',misa:'chu',orar:'ora',apr:'con',dia:'rutina',apo:'med'},store.get('sub',{})),
  rv:'paso',rs:0,rc:0,rk:'',
  gi:0,ps:0,plist:false,q:null,qf:'all',gq:'',year:new Date().getFullYear(),day:ymd(new Date()),say:{},speaking:null
};
if(state.sub.dia==='aj')state.sub.dia='rutina';
if(state.sub.apr==='part')state.sub.apr='euc';
if(!store.get('misaV3',false)){state.sub.misa='chu';store.set('sub',state.sub);store.set('misaV3',true)}
{const r=store.get('ros',null);if(r&&r.d===ymd(new Date())){state.rs=r.rs||0;state.rc=r.rc||0;state.rk=r.rk||'';state.rcs=r.rcs||{}}}

function deck(){
  const c=[];
  DIALOGOS.forEach((x,i)=>c.push({id:'d'+i,k:'d',q:'El celebrante dice: «'+x.p+'». ¿Qué respondemos?',a:x.r,pool:DIALOGOS.map(y=>y.r),por:x.por}));
  ORDEN.forEach((n,i)=>{if(i<ORDEN.length-1)c.push({id:'o'+i,k:'o',q:'¿Qué parte viene justo después de «'+n+'»?',a:ORDEN[i+1],pool:ORDEN.filter(m=>m!==n),por:'Después de «'+n+'» viene «'+ORDEN[i+1]+'».'})});
  GLOS.forEach((g,i)=>c.push({id:'g'+i,k:'g',q:'¿Qué significa «'+g.t+'»?',a:g.d,pool:GLOS.map(y=>y.d),por:'«'+g.t+'»: '+g.d}));
  FACTOS.forEach((f,i)=>c.push({id:'f'+i,k:'f',q:f.q,a:f.a,fixed:f.o,por:f.por}));
  return c;
}
const DECK=deck();
function optsFor(c){
  if(c.fixed)return shuffle([c.a].concat(c.fixed));
  const pool=Array.from(new Set(c.pool)).filter(x=>x!==c.a);
  return shuffle([c.a].concat(shuffle(pool).slice(0,3)));
}
function nextCard(){
  const box=store.get('box',{}),cards=DECK.filter(c=>state.qf==='all'||c.k===state.qf);
  const cand=cards.filter(c=>!state.q||c.id!==state.q.c.id);
  const w=cand.map(c=>1/Math.pow(1+(box[c.id]||0),2));
  let r=Math.random()*w.reduce((a,b)=>a+b,0),i=0;
  for(;i<cand.length-1;i++){r-=w[i];if(r<=0)break}
  const c=cand[i];state.q={c,opts:optsFor(c),pick:null};
}

/* ===== SANTOS DEL CALENDARIO (para saber el color aunque no haya conexión) ===== */
/* [mes, día, nombre, rango, color]  r = rojo (mártires, apóstoles, evangelistas), b = blanco */
function santoDia(d,L){
  const s=SANTOS.find(x=>x[0]===d.getMonth()+1&&x[1]===d.getDate());if(!s)return null;
  const fiesta=s[3]==='Fiesta',senor=/Transfiguración|Santa Cruz|Letrán/.test(s[2]),k=diff(d,easter(d.getFullYear()));
  if(k>=-7&&k<=7)return null; /* Semana Santa y Octava de Pascua: no se celebran santos */
  if(L.rango==='Solemnidad'||L.especial)return null;
  if(L.tiempo==='Navidad'&&L.rango)return null; /* Octava de Navidad: el día ya trae su celebración */
  if(d.getDay()===0&&!(senor&&L.tiempo==='Tiempo Ordinario'))return null; /* el domingo prevalece, salvo una fiesta del Señor en Tiempo Ordinario */
  if(!fiesta&&/Cuaresma|Triduo|Semana Santa/.test(L.tiempo||''))return null; /* en Cuaresma las memorias son solo conmemoración */

function semanaSalterio(d){
  const L=liturgia(d),y=d.getFullYear(),E=easter(y),k=diff(d,E),ash=addDays(E,-46);
  const r=w=>((w-1)%4+4)%4+1;
  if(L.tiempo==='Adviento'||L.tiempo==='Tiempo Ordinario')return L.semana?r(L.semana):null;
  if(k>=-7&&k<-3)return 2;
  if(L.tiempo==='Cuaresma'){if(diff(d,ash)>=0&&diff(d,addDays(ash,4))<0)return 4;if(L.semana===0)return 2;return L.semana?r(L.semana):null}
  if(k>=0&&k<56){const w=Math.floor(k/7)+1;return r(w)}
  return null;
}

function proximas(t,n){const y=t.getFullYear();return fiestas(y-1).concat(fiestas(y),fiestas(y+1)).filter(f=>diff(f.d,t)>=0||(f.nov&&diff(t,f.nov.ini)>=0&&diff(f.d,t)>=0)).filter(f=>diff(f.d,t)<=400).slice(0,n||99)}
function novenaHoy(t){const y=t.getFullYear();for(const f of fiestas(y).concat(fiestas(y+1))){if(!f.nov)continue;const k=diff(t,f.nov.ini);if(k>=0&&k<9)return {f,k}}return null}
function enDias(n){return n===0?'Hoy':n===1?'Mañana':'En '+n+' días'}
/* Frases de santos y Papas: una distinta cada día */
function fraseDia(t){const n=Math.floor((new Date(t.getFullYear(),t.getMonth(),t.getDate())-new Date(2026,0,1))/864e5);return FRASES[((n%FRASES.length)+FRASES.length)%FRASES.length]}
function novDia(f,k){
  const I=NOV_INFO[f.nov.id]||{n:'Novena'},d=f.nov.dias&&f.nov.dias[k];
  if(Array.isArray(d))return {t:d[0],cita:d[1],b:d[2],fin:d[3]};
  if(d)return {t:d,b:I.nota||''};
  return {t:'Día '+(k+1),b:I.nota||''};
}

function diaCarga(f){

async function guardarCopia(){
  const D={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('elm:')===0)D[k]=localStorage.getItem(k)}}catch(e){}
  const n=Object.keys(D).length,msg=$('#bkmsg');
  if(!n){if(msg)msg.textContent='No encontré datos guardados en este teléfono.';return}
  const txt=JSON.stringify({app:'Venga tu Reino',version:1,fecha:new Date().toISOString(),datos:D});
  const nombre='venga-tu-reino-copia-'+ymd(new Date())+'.json';
  let ok=false;
  try{const file=new File([txt],nombre,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Copia de Venga tu Reino'});ok=true}}catch(e){if(e&&e.name==='AbortError'){if(msg)msg.textContent='No se guardó la copia.';return}}
  if(!ok){try{const u=URL.createObjectURL(new Blob([txt],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=nombre;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);ok=true}catch(e){}}
  if(ok){store.set('bkfecha',ymd(new Date()));if(ajAbierto())$('#shc').innerHTML=viewAjustes();const m2=$('#bkmsg');if(m2)m2.textContent='Listo: copia «'+nombre+'». Guárdala en Archivos o en iCloud Drive.'}
  else if(msg)msg.textContent='No se pudo crear la copia en este navegador.';
}
function recuperarCopia(file){
  const msg=$('#bkmsg'),r=new FileReader();
  r.onload=()=>{
    let o=null;try{o=JSON.parse(r.result)}catch(e){}
    if(!o||o.app!=='Venga tu Reino'||!o.datos||typeof o.datos!=='object'){if(msg)msg.textContent='Ese archivo no es una copia de Venga tu Reino.';return}
    const K=Object.keys(o.datos).filter(k=>k.indexOf('elm:')===0&&typeof o.datos[k]==='string');
    const cuando=o.fecha?new Date(o.fecha):null;
    if(!confirm('Vas a recuperar la copia'+(cuando?' del '+cuando.getDate()+' de '+MESES[cuando.getMonth()]+' de '+cuando.getFullYear():'')+'. Lo que tengas ahora en el teléfono se reemplazará por lo de la copia. ¿Continuar?'))return;
    try{K.forEach(k=>localStorage.setItem(k,o.datos[k]))}catch(e){if(msg)msg.textContent='No se pudo recuperar: el teléfono no dejó guardar los datos.';return}
    location.reload();
  };
  r.readAsText(file);
}

const _bib={};
function citaPartes(c){
  let m=String(c||'').trim().match(/^((?:[123]\s)?[^\d,]+?)\s+(\d+)(?:\((\d+)\))?\s*,\s*(.+)$/);
  if(!m){const u=String(c||'').trim().match(/^((?:[123]\s)?[^\d,]+?)\s+(\d+[a-z]*(?:\s*[-–]\s*\d+[a-z]*)?)$/);if(u&&['abdías','filemón','2 juan','3 juan','judas'].includes(u[1].toLowerCase().trim()))m=[0,u[1],'1',0,u[2]];else return null}
  const code=BIB[m[1].toLowerCase().trim()];if(!code)return null;
  let ch=+m[2]; /* Salmos: numeración de la Vulgata, la del primer número del Leccionario («Salmo 22(23)» es el 22), igual que la Biblia que trae la app */const out=[];
  m[4].split(';').forEach((seg,i)=>{seg=seg.trim();
    if(i>0){const mm=seg.match(/^(\d+)\s*,\s*(.+)$/);if(!mm)return;ch=+mm[1];seg=mm[2]}
    seg.split(/\.\s*|\s+y\s+/).forEach(r=>{const q=r.trim().match(/^(\d+)[a-z]*(?:\s*[-–]\s*(\d+)[a-z]*)?$/);if(q)out.push([ch,+q[1],+(q[2]||q[1])])});
  });
  return out.length?{code,r:out}:null;
}

    if(p.say)h+='<div class="row" style="margin:6px 0">'+sayBtn('r_'+p.say+'_'+i,oraT(p.say).replace(/\n/g,' '))+'</div>';
    if(n)h+='<p class="small mut" style="text-align:center;margin:10px 0 0">Si quieres llevar la cuenta, toca una bolita por cada Ave María</p><div class="beads rdots" data-i="'+i+'">'+Array.from({length:n},(_,j)=>'<button class="'+(j<c?'on':'')+'" data-act="rdot" data-v="'+i+':'+j+'" aria-label="Ave María '+(j+1)+'"></button>').join('')+'</div>';
    h+='</section>';
  });
  h+='<section class="rstep rfin" id="rfin"><div class="fin">'+ic('check')+'<h2>¡Rezaste el Rosario!</h2><p>María te acompaña. Lo que hoy meditaste se queda contigo.</p></div><div class="row" style="justify-content:center"><button class="btn" data-act="rdone">Marcar en mi rutina</button><button class="btn ghost" data-act="rreset">Empezar de nuevo</button></div><p class="note" id="rmsg" style="text-align:center"></p></section>';

function rosBead(s){const n=+s.dataset.n,b=s.dataset.bead;if(!n)return b;const c=Math.min((state.rcs||{})[s.dataset.i]||0,n-1);return b==='s'?'s'+(c+1):b+(c+1)}
function rosSync(force){
  const S=document.querySelectorAll('#rflow .rstep:not(.rfin)');if(!S.length)return;
  const bar=$('#rbar'),y0=(bar?bar.getBoundingClientRect().bottom:0)+innerHeight*.18;
  let cur=-1;S.forEach((s,i)=>{if(s.getBoundingClientRect().top<=y0)cur=i});
  const fin=$('#rfin');
  if(fin&&fin.getBoundingClientRect().top<innerHeight*.6){if(!state.rfin){state.rfin=1;state.rs=0;rosSave();celebrar()}cur=S.length}
  if(cur===state.rcur&&!force)return;state.rcur=cur;
  S.forEach((s,i)=>s.classList.toggle('on',i===cur));
  const done=cur>=S.length,s=S[Math.min(Math.max(cur,0),S.length-1)];
  $('#rmini').innerHTML=rosMap(cur<0?'':done?'X':rosBead(s));
  $('#rtit').textContent=cur<0?'Baja para empezar':done?'¡Terminaste!':s.dataset.t;
  $('#rnum').textContent=cur<0?S.length+' pasos':done?'Rosario completo':'Paso '+(cur+1)+' de '+S.length;
  $('#rprog').style.width=(cur<0?0:done?100:Math.round(cur/S.length*100))+'%';
  if(cur>=0&&!done&&state.rs!==cur){state.rs=cur;rosSave()}
}

  else{to=s.offsetHeight+(d.offsetHeight-d.clientHeight);d._closing=true}
  const a=d.animate({height:[from+'px',to+'px']},{duration:opening?300:240,easing:'cubic-bezier(.2,.7,.2,1)'});
  const inn=d.querySelector(':scope>.in');
  if(opening&&inn&&inn.animate)inn.animate({opacity:[0,1],transform:['translateY(-6px)','none']},{duration:300,easing:'ease-out'});
  d._a=a;
  a.onfinish=()=>{if(d._closing){d.open=false;d._closing=false}d.style.overflow='';d.style.height='';d._a=null};
  a.oncancel=()=>{d.style.overflow='';d.style.height=''};
});

/* Guarda en el teléfono los próximos días ya preparados, para que la app cambie de día aunque no haya internet. */
let diasT=0;
async function guardarDias(){
  if(Date.now()-diasT<36e5||!('caches' in window)||!navigator.serviceWorker||!navigator.serviceWorker.controller)return;
  diasT=Date.now();const t=new Date();
  fetch('dias/linea.json').catch(()=>{});
  /* Los días preparados (hasta el primero que todavía no existe) y los libros de la Biblia de sus lecturas, para leerlas sin internet */
  const libros=new Set();

  if(window.HOY)citas(window.HOY);
  for(let i=1;i<=7;i++){const u='dias/'+ymd(addDays(t,i))+'.js';
    try{let r=await caches.match(u);if(!r){r=await fetch(u);if(!r.ok)break}
      const tx=await r.clone().text();citas(JSON.parse(tx.replace(/^\s*window\.HOY\s*=\s*/,'').replace(/;\s*$/,'')))}catch(e){break}}
  for(const k in FE){const u=feSm(FE[k][0]);try{if(!(await caches.match(u)))await fetch(u,{mode:'no-cors'})}catch(e){}}
}
