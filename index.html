<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
/* Diseño «Crepúsculo de Barquisimeto»: lo único llamativo es el cielo de la portada, que cambia con la hora
   y lleva el color litúrgico del día. Todo lo demás es tranquilo: fondo de cal fría, tinta índigo, oro discreto.
   Marcellus (letra de inscripción romana) para títulos; Literata (hecha para leer en pantalla) para el texto. */
:root{--bg:#FFFFFF;--card:#FFFFFF;--ink:#2A2316;--mut:#7A6D55;--line:#EFE7D6;--soft:#FAF6EC;--gold:#9C700A;--gold-bg:#FDF4D6;--wine:#E1AE1E;--on-wine:#2A2316;--ok:#2E7A4F;--bad:#B3302F;--lit:#C9960F;--litc:#C9960F;--tint:#FBF5E6;--vy:#E1AE1E;--vw:#FFFFFF;--red:#B0182A;--red-bg:#FBEDEE;--fd:'Marcellus','Trajan Pro',Georgia,serif;--fb:'Literata',Georgia,'Times New Roman',serif;--r:20px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:17px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:12px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
#app{max-width:620px;margin:0 auto}
h1,h2,h3{font-family:var(--fd);font-weight:400;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:1.45rem;margin:26px 0 8px}
h3{font-size:1.15rem;margin:16px 0 4px}
p{margin:6px 0}
a{color:var(--ink);text-decoration-color:var(--gold);text-underline-offset:3px}
.mut{color:var(--mut)}
.small{font-size:.88rem}
/* Cabecera compacta (otras pestañas) */
.hd.c{display:flex;gap:12px;align-items:center;padding:6px 2px 10px;border-bottom:1px solid var(--line);margin-bottom:6px;line-height:1.3}
.hd.c b{font-family:var(--fd);font-weight:400;font-size:1.05rem}
/* Portada */
.hero{position:relative;border-radius:28px;overflow:hidden;color:#fff;margin:2px 0 14px;min-height:370px;isolation:isolate;text-shadow:0 1px 12px rgba(10,10,40,.35)}
.hero.day{color:#1F2140;text-shadow:0 1px 10px rgba(255,255,255,.5)}
.hero.day .pill{background:rgba(255,255,255,.55)}
.hero svg.sky{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero .ht{padding:56px 22px 0}
.hero .when{font-size:.92rem;opacity:.92}
.hero .frase{font-family:var(--fd);font-size:1.6rem;line-height:1.25;margin:6px 0 6px;text-wrap:balance}
.hero .cita{font-size:.92rem;opacity:.9}
.hero .top{position:absolute;top:14px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;font-size:.85rem}
.hero .brand{font-family:var(--fd);font-size:1.05rem;letter-spacing:.04em}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.18);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;padding:3px 11px;border-radius:999px;background:var(--soft);color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--litc);display:inline-block;box-shadow:0 0 0 2px color-mix(in srgb,var(--lit) 25%,transparent)}
/* Superficies: una sola tarjeta blanca sin sombra; lo secundario va sobre el fondo */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:12px 0}
.card.tint{background:transparent;border:0;border-left:3px solid var(--lit);border-radius:0;padding:4px 0 4px 14px}
.card h3:first-child{margin-top:0}
.seg{display:flex;gap:4px;overflow-x:auto;padding:4px;margin:10px 0 8px;scrollbar-width:none;background:var(--soft);border-radius:999px}
.seg::-webkit-scrollbar{display:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.seg button{flex:none;min-height:40px;padding:6px 15px;border-radius:999px;border:0;background:transparent;font-size:.92rem;color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(20,22,50,.12)}
.btn{min-height:48px;padding:10px 20px;border-radius:999px;border:1.5px solid var(--wine);background:var(--wine);color:var(--on-wine);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.big{width:100%;min-height:56px;font-size:1.05rem}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
details{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:8px 0}
summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:12px;min-height:52px;font-weight:600}
summary::-webkit-details-marker{display:none}
summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:1.5px solid var(--mut);border-bottom:1.5px solid var(--mut);transform:rotate(45deg);transition:transform .2s;flex:none}
details[open]>summary::after{transform:rotate(-135deg)}
details .in{padding:0 16px 16px}
.num{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;font-family:var(--fd)}
.sec{font-family:var(--fd);font-weight:400;font-size:1.35rem;margin:30px 2px 6px;color:var(--ink)}
.say{border-left:3px solid var(--gold);background:var(--gold-bg);padding:10px 14px;border-radius:0 14px 14px 0;margin:10px 0}
.say b{font-size:.84rem;color:var(--gold);display:block;font-weight:600}
.lbl{font-size:.88rem;font-weight:600;color:var(--gold);margin:14px 0 2px}
.prayer{font-family:var(--fb);font-size:1.06rem;line-height:1.75;white-space:pre-line}
.opt{display:block;width:100%;text-align:left;min-height:50px;margin:8px 0;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--card)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.q{font-family:var(--fd);font-size:1.3rem;line-height:1.35;margin:6px 0 10px}
.bar{height:6px;background:var(--soft);border-radius:4px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--lit)}
.chk{display:flex;gap:12px;align-items:flex-start;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer;min-height:50px}
.chk:last-child{border-bottom:0}
.chk input{width:22px;height:22px;margin-top:3px;flex:none;accent-color:var(--lit)}
.chk .t{font-size:.84rem;color:var(--mut)}
textarea{width:100%;min-height:90px;resize:vertical;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--bg);color:var(--ink);font:inherit;margin-top:6px}
ul.tight{margin:6px 0;padding-left:20px}
ul.tight li{margin:5px 0}
table.dates{width:100%;border-collapse:collapse;font-size:.96rem}
table.dates td{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.dates td:first-child{white-space:nowrap;padding-right:12px;color:var(--gold);font-weight:600}
.sw{width:18px;height:18px;border-radius:50%;flex:none;margin-top:4px}
.colrow{display:flex;gap:12px;align-items:flex-start;margin:8px 0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:4px max(6px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));z-index:5}
nav.tabs .in{max-width:620px;margin:0 auto;display:flex}
nav.tabs button{flex:1;background:none;border:0;padding:7px 2px 5px;min-height:58px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;color:var(--mut);font-family:var(--fb)}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:600}
nav.tabs button[aria-current="page"] svg{stroke:var(--lit);stroke-width:2}
.note{font-size:.86rem;color:var(--mut);margin:12px 2px}
/* Iconos de línea */
.ic{width:44px;height:44px;stroke:var(--lit);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:28px;height:28px}
/* Atajos del día */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 10px;text-align:left;min-height:104px;display:flex;flex-direction:column;gap:6px;font-size:.86rem;line-height:1.3}
.tile b{font-family:var(--fd);font-weight:400;font-size:1rem}
/* Racha */
.streak{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 0}
.streak .small{white-space:nowrap}
.week{display:flex;gap:6px}
.week span{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--mut)}
.week span.on{background:var(--lit);border-color:var(--lit);color:#fff}
.week span.today{border:1.5px solid var(--ink)}
/* Modo oración paso a paso */
.pager{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:22px 20px 18px;margin:10px 0;min-height:420px;display:flex;flex-direction:column}
.pager .ph{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:var(--line);min-height:0}
.dots button.on{background:var(--lit);width:26px;border-radius:6px}
.dots button.done{background:color-mix(in srgb,var(--lit) 45%,var(--line))}
.pager h2{margin:14px 0 6px;font-size:1.6rem}
.pager .pb{flex:1}
.pager .pn{display:flex;gap:8px;margin-top:16px}
.pager .pn .btn{flex:1}
.fin{text-align:center;padding:10px 0}
.fin .ic{width:72px;height:72px}
.reading p{font-size:1.05rem;line-height:1.75}
.reading p:first-of-type::first-letter{font-family:var(--fd);font-size:3.1em;float:left;line-height:.9;padding:6px 8px 0 0;color:var(--lit)}
@media (prefers-reduced-motion:no-preference){.pager .pb{animation:pin .35s ease-out}@keyframes pin{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}}
@media (prefers-reduced-motion:reduce){summary::after{transition:none}}
/* ===== Misa simple, Rosario guiado, Apóstol ===== */
.cita{font-size:.88rem;color:var(--mut)}
.say .prayer{display:block}
.say.big .prayer{font-size:1.12rem}
.cue{font-size:.92rem;color:var(--mut);margin:10px 0 2px;line-height:1.45}
.cue span{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-right:6px}
.hoyb{background:var(--tint);border-radius:14px;padding:10px 14px;margin:10px 0}
.hoyb>b{display:block;font-size:.84rem;color:var(--gold);font-weight:600}
.hoyb p{margin:4px 0 0}
.hoyb.par{border-left:3px solid var(--lit)}
.nota{border:1.5px solid var(--gold);background:var(--gold-bg);border-radius:14px;padding:10px 14px;margin:10px 0}
.nota>b{display:block;font-size:.84rem;color:var(--gold)}
ul.hoyl{list-style:none;padding:0;margin:10px 0 4px;display:flex;flex-wrap:wrap;gap:6px}
ul.hoyl li{font-size:.84rem;padding:3px 11px;border-radius:999px;background:var(--soft)}
ul.hoyl li i{font-style:normal;margin-right:5px;color:var(--ok)}
ul.hoyl li.n{opacity:.6}
ul.hoyl li.n i{color:var(--mut)}
.gnav{display:flex;gap:8px;margin:10px 0 14px}
.gnav .btn{flex:1}
.gsel{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--card);color:var(--ink);font:inherit;margin:6px 0}

.resp{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:8px 0}
.resp .rh{display:flex;align-items:center;gap:10px;line-height:1.3}
.resp .rh b{font-weight:600}
.resp .pos{margin-left:auto;font-size:.76rem;color:var(--mut);text-align:right}
.resp .say{margin:8px 0 0}
.lk{background:none;border:0;color:var(--mut);font-size:.86rem;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.card.imp h2{margin:4px 0 8px}
/* Rosario */
.rmap{display:block;width:190px;height:auto;margin:0 auto 4px}
.rmap .ch{fill:none;stroke:var(--mut);stroke-width:1;opacity:.5}
.rmap .b{fill:var(--soft);stroke:var(--mut);stroke-width:1.1}
.rmap .b.d{fill:color-mix(in srgb,var(--lit) 55%,var(--card));stroke:var(--lit)}
.rmap .b.a{fill:var(--gold);stroke:var(--gold)}
.rmap .ring{fill:none;stroke:var(--gold);stroke-width:2;opacity:.7}
.rmap .cx{stroke:var(--mut);stroke-width:3;stroke-linecap:round}
.rmap .cx.d{stroke:var(--lit)}
.rmap .cx.a{stroke:var(--gold)}
.where{display:inline-flex;align-items:center;gap:6px;font-size:.86rem;padding:4px 12px;border-radius:999px;background:var(--gold-bg);color:var(--ink);margin:2px 0 6px}
.beads{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0 8px}
.beads i{width:22px;height:22px;border-radius:50%;border:2px solid var(--lit);display:inline-block}
.beads i.on{background:var(--lit)}
.tap{width:100%;min-height:84px;border-radius:22px;border:2px dashed var(--lit);background:var(--tint);color:var(--ink);font-size:1.08rem;font-weight:600;margin:4px 0}
.tap.ok{border-style:solid;background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.pick button{min-height:54px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);text-align:left;padding:8px 12px;line-height:1.25}
.pick button[aria-pressed="true"]{border-color:var(--lit);background:var(--tint)}
.pick button small{display:block;color:var(--mut);font-size:.78rem}
/* Apóstol */
.qa{margin:6px 0 0;padding-left:20px}
.qa li{margin:6px 0}
.fi{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--bg);color:var(--ink);font:inherit;margin-top:6px}
.ficha{border-top:1px solid var(--line);padding:10px 0}
.ficha:first-child{border-top:0}
nav.tabs button{font-size:.66rem;padding:7px 0 5px}
/* ===== Movimiento: transiciones entre páginas, al desplazarse y al abrir tarjetas.
   Todo se apaga si el teléfono tiene activado «Reducir movimiento». ===== */
nav.tabs{transition:transform .32s cubic-bezier(.2,.7,.2,1)}
nav.tabs.hide{transform:translateY(115%)}
@media (prefers-reduced-motion:no-preference){
#hd.go-r,#main.go-r{animation:vgr .38s cubic-bezier(.2,.7,.2,1) both}
#hd.go-l,#main.go-l{animation:vgl .38s cubic-bezier(.2,.7,.2,1) both}
#hd.go-f,#main.go-f{animation:vgf .34s ease-out both}
@keyframes vgr{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes vgl{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes vgf{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.rv{opacity:0;transform:translateY(26px) scale(.98);transition:opacity .5s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
.rv.up{transform:translateY(-26px) scale(.98)}
.rv.vis{opacity:1;transform:none}
nav.tabs button.pop svg{animation:vpop .42s cubic-bezier(.3,1.5,.5,1)}
@keyframes vpop{0%{transform:scale(.8)}60%{transform:scale(1.2) translateY(-2px)}100%{transform:none}}
.btn,.seg button,nav.tabs button{transition:transform .12s ease,background-color .25s,color .25s,box-shadow .25s}
.btn:active,.seg button:active,nav.tabs button:active{transform:scale(.94)}
summary{transition:background-color .2s}
summary:active{background:var(--soft);border-radius:16px}
}
/* ===== Vitrales: imágenes de fe que se revelan al desplazarse (oro y blanco del Vaticano) ===== */
#prog{position:fixed;top:0;left:0;right:0;height:3px;z-index:9;transform-origin:0 50%;transform:scaleX(var(--sp,0));background:linear-gradient(90deg,var(--vy) 0 50%,#fff 50% 100%);background-size:24px 3px;box-shadow:0 0 0 .5px rgba(154,110,12,.35);pointer-events:none}

 transform-origin:50% 100%;transform:perspective(1100px) rotateX(calc(var(--c,0)*3.2deg)) scale(calc(1 - var(--c,0)*.024));
 border-radius:calc(var(--c,0)*5px) calc(var(--c,0)*5px) calc(var(--c,0)*3px) calc(var(--c,0)*3px)/calc(var(--c,0)*9px) calc(var(--c,0)*9px) calc(var(--c,0)*3px) calc(var(--c,0)*3px);will-change:transform}
.fe img,.story img{position:absolute;inset:-10% 0;width:100%;height:120%;object-fit:cover;transform:translate3d(0,calc(var(--y,0)*1%),0) scale(var(--s,1));will-change:transform}
.fe::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,14,4,.05) 35%,rgba(20,14,4,.78) 100%);z-index:1}
.fe figcaption,.story .cap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:0 max(24px,calc(50vw - 290px)) 36px;opacity:var(--o,1);transform:translateY(calc((1 - var(--o,1))*24px))}
.vk{display:block;width:44px;height:4px;margin-bottom:12px;background:linear-gradient(90deg,var(--vy) 50%,#fff 50%);border-radius:2px}
.fe-t{font-family:var(--fd);font-size:1.7rem;line-height:1.22;margin:0 0 8px;text-wrap:balance;text-shadow:0 2px 18px rgba(0,0,0,.45)}
.fe-c{font-size:.9rem;color:#F6DE8D;letter-spacing:.03em}
.fe-cr{position:absolute;top:12px;right:max(14px,calc(50vw - 300px));z-index:2;font-size:.68rem;opacity:.7;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.story{position:relative;margin:40px calc(50% - 50vw) 0}
.story .stick{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:#1a140a;color:#fff}
.story .ly{position:absolute;inset:0;opacity:var(--a,0);isolation:isolate}
.story .ly::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,14,4,.15) 30%,rgba(20,14,4,.8) 100%);z-index:1}
.story .cap{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}

.story .pips i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4);transition:background .3s,transform .3s}
.story .pips i.on{background:var(--vy);transform:scale(1.5)}
.story .stick{background:radial-gradient(120% 80% at 50% 42%,#2a1e08 0%,#120d05 60%,#0b0803 100%)}
.story .sol{position:absolute;left:50%;top:44%;width:min(86vw,520px);aspect-ratio:1;z-index:0;transform:translate(-50%,-50%) scale(var(--hs,.7));pointer-events:none}
.story .sol .disc{position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle at 50% 50%,#FFF8E1 0%,#FBE08A 35%,#E8B923 62%,#B9820F 100%);box-shadow:0 0 80px 20px rgba(232,185,35,.35),0 0 200px 60px rgba(232,185,35,.15)}
.story .sol svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(var(--hr,0deg));opacity:.85}
.story .ly{opacity:1;z-index:1}
.story .ly .pic{position:absolute;inset:0;clip-path:circle(var(--r,0%) at 50% 44%);z-index:0}
.story .ly .pic img{inset:-6% 0;height:112%;transform:translate3d(0,calc(var(--y,0)*1% + var(--sh,0px)),0) scale(var(--s,1))}
.story .ly::after{opacity:var(--o,0)}
.story .cap{text-align:left;padding:0 26px calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(calc((1 - var(--o,1))*-34px))}
.story .cap .w{display:inline-block;opacity:calc(var(--o,1)*1.4 - var(--i,0)*.06);transform:translateY(calc((1 - var(--o,1))*14px))}
@media (prefers-reduced-motion:reduce){.fe{transform:none;border-radius:0}.fe img,.story img{transform:none}.fe figcaption{opacity:1;transform:none}}
/* ===== Portada de cada pestaña: imagen de fe a todo lo ancho, con aureola dorada ===== */
.ph{position:relative;height:min(46vh,430px);min-height:300px;margin:-12px calc(50% - 50vw) 8px;overflow:hidden;color:#fff;isolation:isolate;border-radius:0 0 30px 30px;background:#2a1e08}
.ph.big{height:min(64vh,580px);min-height:420px}
.ph .pi{position:absolute;inset:0;z-index:-2}
.ph .pi img{position:absolute;inset:-6% 0;width:100%;height:112%;object-fit:cover;transform:translate3d(0,calc(var(--k,0)*22%),0) scale(calc(1.06 + var(--k,0)*.14))}
.ph::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(30,20,4,.35) 0%,rgba(30,20,4,0) 28%,rgba(30,20,4,.15) 50%,rgba(30,20,4,.78) 100%)}
.ph .glow{position:absolute;right:-18%;top:-22%;width:70vw;max-width:420px;aspect-ratio:1;border-radius:50%;z-index:-1;background:radial-gradient(circle,rgba(255,240,190,.55) 0%,rgba(232,185,35,.25) 35%,transparent 70%);mix-blend-mode:screen;transform:scale(calc(1 + var(--k,0)*.4))}
.ph .pt{position:absolute;left:0;right:0;bottom:0;padding:0 max(22px,calc(50vw - 300px)) 26px;transform:translateY(calc(var(--k,0)*-46px));opacity:calc(1 - var(--k,0)*1.5)}
.ph .kick{font-size:.82rem;letter-spacing:.04em;color:#FBE7A6;display:flex;align-items:center;gap:8px;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.ph h1{font-size:2.3rem;line-height:1.12;margin:6px 0 4px;text-shadow:0 2px 20px rgba(0,0,0,.45);text-wrap:balance}
.ph.big h1{font-size:1.75rem;line-height:1.25}
.ph .sub{font-size:.92rem;opacity:.9;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.ph .vk{margin-bottom:10px}
.ph .fe-cr{top:auto;bottom:8px;right:max(14px,calc(50vw - 300px));font-size:.6rem;opacity:.55}
.ph .dot{box-shadow:0 0 0 2px rgba(255,255,255,.6)}
@media (prefers-reduced-motion:no-preference){
.ph .pi img{animation:phz 1.6s cubic-bezier(.2,.7,.2,1) both}
.ph .pt>*{animation:phu .9s cubic-bezier(.2,.7,.2,1) both}
.ph .pt>*:nth-child(2){animation-delay:.08s}.ph .pt>*:nth-child(3){animation-delay:.16s}.ph .pt>*:nth-child(4){animation-delay:.24s}
@keyframes phz{from{opacity:0;scale:1.18}to{opacity:1;scale:1}}
@keyframes phu{from{opacity:0;translate:0 22px}to{opacity:1;translate:0 0}}
}

<script>
(function(){
'use strict';
/* ===== CONTENIDO ===== */
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

/* La Misa, parte por parte. "dice" = respuestas cortas del pueblo; los textos largos del Misal se resumen. */
const MISA=[
{id:'ini',n:'Ritos iniciales',lema:'Nos reunimos',res:'Dejamos de ser personas sueltas y nos hacemos comunidad. Estos ritos nos preparan para escuchar a Dios y celebrar la Eucaristía.',partes:[
{n:'Canto y procesión de entrada',que:'El sacerdote y los ministros entran en procesión mientras el pueblo canta. Al llegar, el sacerdote besa el altar y, en días solemnes, lo inciensa.',dice:[],sig:'Somos un pueblo que se pone en camino hacia Dios. El altar representa a Cristo, por eso se besa y se venera.',pos:'De pie',tip:'Canta aunque desafines: no es un concierto, es oración en común.'},
{n:'Saludo y Señal de la Cruz',que:'El sacerdote nos hace santiguar y nos saluda en nombre del Señor.',dice:[['Sacerdote','En el nombre del Padre, y del Hijo, y del Espíritu Santo.'],['Pueblo','Amén.'],['Sacerdote','El Señor esté con ustedes.'],['Pueblo','Y con tu espíritu.']],sig:'Empezamos como lo que somos: bautizados en el nombre de la Trinidad. «Y con tu espíritu» quiere decir «y contigo también»; alude al Espíritu que el sacerdote recibió al ser ordenado.',pos:'De pie',tip:'Santíguate despacio y con conciencia: es la primera oración de la Misa.'},
{n:'Acto penitencial',que:'Reconocemos juntos que necesitamos misericordia antes de acercarnos a lo sagrado. Hay varias fórmulas; la más conocida es «Yo confieso».',dice:[['Pueblo','Yo confieso ante Dios todopoderoso y ante ustedes, hermanos… (texto completo en la pestaña Oraciones)']],sig:'Es un momento de humildad. Perdona los pecados leves, pero no reemplaza la confesión sacramental si hay un pecado grave. Al decir «por mi culpa» uno se golpea el pecho.',pos:'De pie',tip:'Aprovecha el breve silencio para nombrar en tu interior algo concreto.'},
{n:'Señor, ten piedad (Kyrie)',que:'Una aclamación breve a Cristo, repetida en tres pares.',dice:[['Todos','Señor, ten piedad. · Cristo, ten piedad. · Señor, ten piedad.']],sig:'«Kyrie eleison» es griego: «Señor, ten piedad». «Señor» es el título que los primeros cristianos daban a Jesús resucitado, así que no es solo pedir perdón: también es alabanza.',pos:'De pie',tip:'Piensa en una persona o situación que necesite la misericordia de Dios.'},
{n:'Gloria',que:'Himno antiguo de alabanza a la Trinidad. Se canta o reza los domingos (menos en Adviento y Cuaresma), en solemnidades y fiestas.',dice:[['Todos','Gloria a Dios en el cielo, y en la tierra paz a los hombres que ama el Señor… (sigue el himno completo)']],sig:'Empieza con las palabras de los ángeles en Belén (Lucas 2, 14). Es una explosión de alegría, por eso se omite cuando el tiempo litúrgico es de espera o penitencia.',pos:'De pie',tip:'Si no te sabes el Gloria, léelo de una hoja o del misal; aprenderlo entero es un buen objetivo.'},
{n:'Oración colecta',que:'El sacerdote invita a orar («Oremos»), se hace un momento de silencio y luego dice la oración del día.',dice:[['Sacerdote','Oremos.'],['Pueblo','(silencio) … y al final de la oración: Amén.']],sig:'«Colecta» viene de «recoger»: el sacerdote recoge en una sola oración las intenciones de todos. El «Amén» significa «así es, hago mía esta oración».',pos:'De pie',tip:'El silencio que sigue a «Oremos» es para presentar tus intenciones personales.'}
]},
{id:'pal',n:'Liturgia de la Palabra',lema:'Dios nos habla',res:'Dios dialoga con su pueblo: nos habla en las lecturas y nosotros respondemos con el salmo, la fe y la oración por todos.',partes:[
{n:'Primera lectura',que:'Un lector proclama un texto del Antiguo Testamento (en Pascua, de los Hechos de los Apóstoles).',dice:[['Lector','Palabra de Dios.'],['Pueblo','Te alabamos, Señor.']],sig:'Dios prepara su plan a lo largo de la historia de Israel; el Antiguo Testamento anuncia a Cristo.',pos:'Sentados',tip:'Escucha como si fuera una carta dirigida a ti. No hace falta leer mientras tanto: escuchar también es una forma de leer.'},
{n:'Salmo responsorial',que:'Un salmista canta o lee el salmo y el pueblo repite una respuesta (antífona).',dice:[['Pueblo','Repite la respuesta que indica el salmista.']],sig:'Respondemos a Dios con sus propias palabras. Los salmos son la oración de Israel y también la que rezaba Jesús.',pos:'Sentados',tip:'Cantar o decir la respuesta es participar activamente: no la dejes solo para el coro.'},
{n:'Segunda lectura',que:'Los domingos y solemnidades se lee una carta de un apóstol o el Apocalipsis.',dice:[['Lector','Palabra de Dios.'],['Pueblo','Te alabamos, Señor.']],sig:'Nos muestra cómo vivían y entendían la fe las primeras comunidades cristianas.',pos:'Sentados',tip:'Pregúntate: ¿qué me pide esta carta a mí hoy?'},
{n:'Aleluya',que:'Aclamación cantada antes del Evangelio. En Cuaresma no se dice «Aleluya» y se usa otra aclamación a Cristo.',dice:[['Todos','Aleluya, aleluya, aleluya.']],sig:'«Aleluya» es hebreo: «alaben al Señor». Recibimos a Cristo que va a hablarnos en el Evangelio.',pos:'De pie',tip:'Nos ponemos de pie para recibir a Jesús como se recibe a una persona importante.'},
{n:'Evangelio',que:'El sacerdote o diácono lee la vida y las palabras de Jesús. Es el momento más alto de la Liturgia de la Palabra.',dice:[['Sacerdote','El Señor esté con ustedes.'],['Pueblo','Y con tu espíritu.'],['Sacerdote','Lectura del santo Evangelio según san…'],['Pueblo','Gloria a ti, Señor.'],['Sacerdote','Palabra del Señor.'],['Pueblo','Gloria a ti, Señor Jesús.']],sig:'Con el pulgar hacemos tres cruces pequeñas: en la frente, en los labios y en el pecho. Pedimos que Cristo esté en mi mente, en mis palabras y en mi corazón. El libro se inciensa y se besa porque en él habla Cristo.',pos:'De pie',tip:'Estas respuestas pueden variar un poco según el país. Dilas en voz alta con la comunidad.'},
{n:'Homilía',que:'El sacerdote o diácono explica las lecturas y las conecta con la vida de hoy.',dice:[],sig:'«Homilía» viene del griego y significa «conversación». No es un discurso cualquiera: es la Palabra aplicada a la vida concreta. En domingo es obligatoria.',pos:'Sentados',tip:'Anota una sola frase y trata de vivirla durante la semana.'},
{n:'Credo',que:'Toda la asamblea proclama su fe. Se hace los domingos y solemnidades. Se usa el Credo Niceno-Constantinopolitano o, alternativamente, el Símbolo de los Apóstoles.',dice:[['Todos','Creo en un solo Dios, Padre todopoderoso, Creador del cielo y de la tierra… (texto completo en tu misal)']],sig:'Es la fe de la Iglesia desde los concilios de Nicea (año 325) y Constantinopla (año 381). Tiene tres partes: Padre, Hijo y Espíritu Santo; después menciona la Iglesia y la vida eterna. En la frase de la Encarnación se hace una inclinación profunda.',pos:'De pie',tip:'No es un trámite: cada frase afirma algo que creo. Intenta detenerte en una.'},
{n:'Oración de los fieles',que:'Se piden intenciones por la Iglesia, los gobernantes, los necesitados, el mundo y la comunidad.',dice:[['Pueblo','Responde con la fórmula que indique el lector (por ejemplo, «Te rogamos, óyenos»).']],sig:'Todo bautizado ejerce su sacerdocio rezando por los demás. Es la oración del pueblo, no solo del sacerdote.',pos:'De pie',tip:'Añade en tu interior una intención por alguien que lo necesite.'}
]},
{id:'euc',n:'Liturgia Eucarística',lema:'Damos gracias y recibimos',res:'Repetimos lo que Jesús hizo en la Última Cena: tomó pan y vino, dio gracias, los partió y los repartió. Es el corazón de la Misa.',partes:[
{n:'Presentación de los dones',que:'Se llevan al altar el pan, el vino (y la colecta). El sacerdote bendice a Dios por ellos y mezcla una gota de agua con el vino.',dice:[['Pueblo','Bendito seas por siempre, Señor.']],sig:'Ofrecemos pan y vino, «fruto de la tierra y del trabajo del hombre»: es decir, también nuestra vida y esfuerzos. La gota de agua representa nuestra unión con Cristo.',pos:'Sentados',tip:'Pon mentalmente en el altar algo tuyo: tu trabajo, una preocupación, una alegría.'},
{n:'Oración sobre las ofrendas',que:'El sacerdote invita a todos a orar para que el sacrificio sea aceptado.',dice:[['Sacerdote','Oren, hermanos, para que este sacrificio mío y de ustedes sea agradable a Dios, Padre todopoderoso.'],['Pueblo','El Señor reciba de tus manos este sacrificio, para alabanza y gloria de su nombre, para nuestro bien y el de toda su santa Iglesia.']],sig:'Cuando dice «mío y de ustedes» recuerda que la Misa la celebramos todos: sacerdote y pueblo, cada uno según su papel.',pos:'De pie',tip:'Esta respuesta es larga; con la práctica de esta app la aprenderás.'},
{n:'Prefacio',que:'Diálogo de apertura de la gran oración de acción de gracias. Cambia según el tiempo litúrgico.',dice:[['Sacerdote','El Señor esté con ustedes.'],['Pueblo','Y con tu espíritu.'],['Sacerdote','Levantemos el corazón.'],['Pueblo','Lo tenemos levantado hacia el Señor.'],['Sacerdote','Demos gracias al Señor, nuestro Dios.'],['Pueblo','Es justo y necesario.']],sig:'«Eucaristía» significa «acción de gracias». Aquí empieza la gran acción de gracias: elevamos el corazón y reconocemos que dar gracias a Dios es lo justo y necesario.',pos:'De pie',tip:'Cuando digas «lo tenemos levantado hacia el Señor», ponlo de verdad: deja a un lado las preocupaciones.'},
{n:'Santo (Sanctus)',que:'Cantamos junto con los ángeles la santidad de Dios.',dice:[['Todos','Santo, Santo, Santo es el Señor, Dios del universo… (sigue el himno)']],sig:'Une las palabras de los serafines en Isaías 6, 3 con el grito de la multitud al entrar Jesús en Jerusalén, «Hosanna… bendito el que viene en nombre del Señor» (Mateo 21, 9).',pos:'De pie, y después según la costumbre local (en muchos lugares se arrodilla desde aquí o desde la consagración)',tip:'Si no recuerdas la letra, léela: es de las partes que más conviene aprender.'},
{n:'Plegaria Eucarística',que:'Es la oración central de la Misa. Dirigida al Padre, tiene varios momentos que se suceden sin interrupción: invocación del Espíritu, consagración, memorial, ofrecimiento e intercesiones.',dice:[['Sacerdote','(Consagración) Repite las palabras y gestos de Jesús en la Última Cena sobre el pan y sobre el cáliz.'],['Sacerdote','Este es el Sacramento de nuestra fe.'],['Pueblo','Anunciamos tu muerte, proclamamos tu resurrección. ¡Ven, Señor Jesús!'],['Sacerdote','Por Cristo, con él y en él… todo honor y toda gloria por los siglos de los siglos.'],['Pueblo','Amén.']],sig:'Epíclesis: el sacerdote extiende las manos y pide al Espíritu Santo que convierta el pan y el vino en el Cuerpo y la Sangre de Cristo. Consagración: Cristo se hace realmente presente; se eleva la hostia y el cáliz. Memorial: recordamos su muerte y resurrección y las hacemos presentes. Intercesiones: rezamos por la Iglesia, los vivos y los difuntos. Doxología final: «Por Cristo, con él y en él…» y el pueblo responde con el «gran Amén», la respuesta más importante de toda la Misa.',pos:'De rodillas durante la consagración (donde se acostumbra) y de pie para la doxología final',tip:'En la elevación puedes decir en silencio «Señor mío y Dios mío» (Juan 20, 28). Al «Amén» final respóndelo fuerte: es tu «sí» a todo lo anterior.'}
]},
{id:'com',n:'Rito de Comunión',lema:'Nos hacemos uno con Cristo',res:'Nos preparamos para recibir a Jesús: rezamos como hijos, nos reconciliamos y compartimos el pan de vida.',partes:[
{n:'Padre Nuestro',que:'Todos rezamos juntos la oración que enseñó Jesús. El sacerdote introduce y después añade una oración sobre el «líbranos del mal».',dice:[['Todos','Padre nuestro, que estás en el cielo… (texto completo en Oraciones)'],['Pueblo','Tuyo es el reino, tuyo el poder y la gloria, por siempre, Señor.']],sig:'Pedimos el pan de cada día —que también se entiende como el Pan de la Eucaristía— y el perdón, justo antes de comulgar.',pos:'De pie',tip:'Deja que cada petición pase despacio por tu mente.'},
{n:'Rito de la paz',que:'Nos damos la paz entre nosotros como gesto de reconciliación.',dice:[['Sacerdote','La paz del Señor esté siempre con ustedes.'],['Pueblo','Y con tu espíritu.'],['Sacerdote','Dense fraternalmente la paz.'],['Todos','La paz sea contigo.']],sig:'No es un saludo social. Jesús enseñó a reconciliarse con el hermano antes de presentar la ofrenda (Mateo 5, 23-24).',pos:'De pie',tip:'Mírale a los ojos a quien le das la paz. Si hay alguien con quien tienes un conflicto, pide a Dios la gracia de perdonar.'},
{n:'Fracción del pan y Cordero de Dios',que:'El sacerdote parte la hostia y deja caer un trozo en el cáliz mientras se canta o reza el Cordero de Dios.',dice:[['Todos','Cordero de Dios, que quitas el pecado del mundo, ten piedad de nosotros. (dos veces)'],['Todos','Cordero de Dios, que quitas el pecado del mundo, danos la paz.']],sig:'Juan Bautista llamó a Jesús «el Cordero de Dios» (Juan 1, 29). En los primeros siglos toda la Misa se llamaba «la fracción del pan» (Hechos 2, 42): muchos que comemos un solo pan formamos un solo cuerpo.',pos:'De pie o de rodillas, según la costumbre del lugar',tip:'Contempla la hostia partida: Cristo se da por entero y por todos.'},
{n:'Comunión',que:'El sacerdote muestra la hostia. Los fieles se acercan en procesión, reciben a Cristo y regresan a su lugar.',dice:[['Sacerdote','Este es el Cordero de Dios que quita el pecado del mundo. Dichosos los invitados a la cena del Señor.'],['Pueblo','Señor, no soy digno de que entres en mi casa, pero una palabra tuya bastará para sanarme.'],['Ministro','El Cuerpo de Cristo.'],['Tú','Amén.']],sig:'Tu «Amén» es una profesión de fe: «sí, creo que este es el Cuerpo de Cristo». Las palabras del pueblo vienen del centurión que pidió a Jesús sanar a su siervo (Mateo 8, 8). Para comulgar hay que ser católico, haber guardado una hora de ayuno y estar en gracia de Dios; si hay conciencia de pecado grave, primero se debe confesar.',pos:'En procesión. Antes de recibir la comunión se hace una inclinación de cabeza. Puede recibirse en la mano (una mano sobre la otra) o en la lengua, según indique tu parroquia.',tip:'Quien no puede comulgar puede hacer una comunión espiritual (ver Oraciones) y, en muchas parroquias, acercarse con los brazos cruzados sobre el pecho para recibir una bendición.'},
{n:'Silencio y oración después de la comunión',que:'Un tiempo de silencio y acción de gracias; después el sacerdote dice una oración final para pedir que el sacramento dé fruto.',dice:[['Sacerdote','Oremos.'],['Pueblo','(Al terminar la oración) Amén.']],sig:'Jesús está realmente presente en ti. Es un momento privilegiado para hablar con él personalmente.',pos:'Sentados o de rodillas, en silencio',tip:'Quédate hasta el final y aprovecha estos minutos: no hay mejor momento para rezar.'}

/* Oraciones. Textos tradicionales de uso común; pueden variar levemente según el país. */
const ORACIONES=[
{id:'cruz',n:'Señal de la Cruz',t:'Por la señal de la santa cruz,\nde nuestros enemigos líbranos, Señor, Dios nuestro.\nEn el nombre del Padre, y del Hijo, y del Espíritu Santo. Amén.',m:'Es la primera y la última oración de la Misa. Al hacerla recordamos que somos bautizados y que Cristo nos salvó con su cruz.'},
{id:'padre',n:'Padre Nuestro',t:'Padre nuestro, que estás en el cielo,\nsantificado sea tu nombre;\nvenga a nosotros tu reino;\nhágase tu voluntad\nen la tierra como en el cielo.\nDanos hoy nuestro pan de cada día;\nperdona nuestras ofensas,\ncomo también nosotros perdonamos\na los que nos ofenden;\nno nos dejes caer en la tentación,\ny líbranos del mal. Amén.',m:'Tiene siete peticiones: las tres primeras son para Dios (su nombre, su reino, su voluntad) y las cuatro últimas para nosotros (pan, perdón, no caer, ser librados del mal). Algunas conferencias episcopales usan «no nos dejes caer en la tentación», otras «no nos induzcas»: pequeñas variantes según el país.'},
{id:'ave',n:'Ave María',t:'Dios te salve, María, llena eres de gracia,\nel Señor es contigo;\nbendita tú eres entre todas las mujeres,\ny bendito es el fruto de tu vientre, Jesús.\nSanta María, Madre de Dios,\nruega por nosotros, pecadores,\nahora y en la hora de nuestra muerte. Amén.',m:'La primera parte une el saludo del ángel Gabriel (Lucas 1, 28) y el de Isabel (Lucas 1, 42). La segunda es la súplica de la Iglesia a María.'},
{id:'vensp',n:'Ven, Espíritu Santo',t:'Ven, Espíritu Santo,\nllena los corazones de tus fieles\ny enciende en ellos el fuego de tu amor.\nV. Envía tu Espíritu y serán creadas todas las cosas.\nR. Y renovarás la faz de la tierra.\n\nOremos: Oh Dios, que has instruido los corazones de tus fieles con la luz del Espíritu Santo, concédenos que, guiados por el mismo Espíritu, sintamos rectamente y gocemos siempre de sus consuelos. Por Cristo, nuestro Señor. Amén.',m:'Se reza al empezar el Encuentro con Cristo, la oración personal o el estudio: pedimos al Espíritu que ilumine la mente, mueva la voluntad y encienda el corazón.'},
{id:'actos',n:'Actos de fe, esperanza y caridad',t:'Después de invocar al Espíritu Santo, haz con tus propias palabras tres actos breves:\n\nFe: dile a Jesús que crees que está aquí y que te escucha.\nEsperanza: dile que confías en Él y en lo que te promete.\nCaridad: dile que lo amas, y en Él a los demás.\n\nPuede ser tan sencillo como:\n«Creo, Jesús, espero en ti y te amo».',m:'No es una fórmula para memorizar, sino una guía para orar de forma libre, desde el corazón. Fe, esperanza y caridad son las virtudes que nos unen directamente a Dios; por eso son un buen comienzo para toda oración. Incluso esa frase tan breve ya es una oración muy profunda.'},
{id:'gloriah',n:'Gloria (himno de la Misa)',t:'Gloria a Dios en el cielo,\ny en la tierra paz a los hombres que ama el Señor.\nPor tu inmensa gloria te alabamos,\nte bendecimos, te adoramos,\nte glorificamos, te damos gracias,\nSeñor Dios, Rey celestial,\nDios Padre todopoderoso.\nSeñor, Hijo único, Jesucristo.\nSeñor Dios, Cordero de Dios, Hijo del Padre;\ntú que quitas el pecado del mundo,\nten piedad de nosotros;\ntú que quitas el pecado del mundo,\natiende nuestra súplica;\ntú que estás sentado a la derecha del Padre,\nten piedad de nosotros;\nporque solo tú eres Santo,\nsolo tú Señor,\nsolo tú Altísimo, Jesucristo,\ncon el Espíritu Santo\nen la gloria de Dios Padre. Amén.',m:'Se canta o se reza los domingos (salvo Adviento y Cuaresma), en solemnidades y fiestas, después del «Señor, ten piedad». Empieza con el canto de los ángeles en Belén.'},
{id:'credon',n:'Credo de la Misa (Niceno-Constantinopolitano)',t:'Creo en un solo Dios,\nPadre todopoderoso,\nCreador del cielo y de la tierra,\nde todo lo visible y lo invisible.\nCreo en un solo Señor, Jesucristo,\nHijo único de Dios,\nnacido del Padre antes de todos los siglos:\nDios de Dios, Luz de Luz,\nDios verdadero de Dios verdadero,\nengendrado, no creado,\nde la misma naturaleza del Padre,\npor quien todo fue hecho;\nque por nosotros, los hombres,\ny por nuestra salvación bajó del cielo,\n(aquí todos se inclinan)\ny por obra del Espíritu Santo\nse encarnó de María, la Virgen,\ny se hizo hombre;\ny por nuestra causa fue crucificado\nen tiempos de Poncio Pilato;\npadeció y fue sepultado,\ny resucitó al tercer día, según las Escrituras,\ny subió al cielo,\ny está sentado a la derecha del Padre;\ny de nuevo vendrá con gloria\npara juzgar a vivos y muertos,\ny su reino no tendrá fin.\nCreo en el Espíritu Santo, Señor y dador de vida,\nque procede del Padre y del Hijo,\nque con el Padre y el Hijo\nrecibe una misma adoración y gloria,\ny que habló por los profetas.\nCreo en la Iglesia,\nque es una, santa, católica y apostólica.\nConfieso que hay un solo bautismo\npara el perdón de los pecados.\nEspero la resurrección de los muertos\ny la vida del mundo futuro. Amén.',m:'Es el Credo que se proclama de pie en la Misa de los domingos y solemnidades, después de la homilía. En algunas Misas se usa en su lugar el Símbolo de los Apóstoles.'},
{id:'santo',n:'Santo (Sanctus)',t:'Santo, Santo, Santo es el Señor,\nDios del universo.\nLlenos están el cielo y la tierra de tu gloria.\nHosanna en el cielo.\nBendito el que viene en nombre del Señor.\nHosanna en el cielo.',m:'Se canta al terminar el prefacio, uniéndonos a los ángeles (Isaías 6, 3) y a la multitud que recibió a Jesús en Jerusalén (Mateo 21, 9).'},
{id:'rcinv',n:'Invocación del Regnum Christi',t:'¡Cristo, Rey nuestro!\n— ¡Venga tu Reino!',m:'Es el lema y la jaculatoria del Regnum Christi, tomado del Padre Nuestro. Pedimos que Cristo reine en nuestro corazón, en la familia, en el trabajo y en la sociedad. Se dice al empezar y al terminar la oración y el Encuentro.'},
{id:'gloria',n:'Gloria al Padre',t:'Gloria al Padre, y al Hijo, y al Espíritu Santo.\nComo era en el principio, ahora y siempre,\ny por los siglos de los siglos. Amén.',m:'Pequeña alabanza a la Trinidad. Se reza al final de cada decena del Rosario y de los salmos.'},
{id:'credoap',n:'Credo (Símbolo de los Apóstoles)',t:'Creo en Dios, Padre todopoderoso,\nCreador del cielo y de la tierra.\nCreo en Jesucristo, su único Hijo, nuestro Señor,\nque fue concebido por obra y gracia del Espíritu Santo,\nnació de santa María Virgen,\npadeció bajo el poder de Poncio Pilato,\nfue crucificado, muerto y sepultado,\ndescendió a los infiernos,\nal tercer día resucitó de entre los muertos,\nsubió a los cielos\ny está sentado a la derecha de Dios, Padre todopoderoso.\nDesde allí ha de venir a juzgar a vivos y muertos.\nCreo en el Espíritu Santo,\nla santa Iglesia católica,\nla comunión de los santos,\nel perdón de los pecados,\nla resurrección de la carne\ny la vida eterna. Amén.',m:'Es el credo más breve y antiguo. En la Misa dominical normalmente se proclama el Credo Niceno-Constantinopolitano, más largo; el de los Apóstoles se usa en el Rosario y como alternativa.'},
{id:'confieso',n:'Yo confieso (Confiteor)',t:'Yo confieso ante Dios todopoderoso\ny ante ustedes, hermanos,\nque he pecado mucho\nde pensamiento, palabra, obra y omisión.\nPor mi culpa, por mi culpa, por mi gran culpa.\nPor eso ruego a santa María, siempre Virgen,\na los ángeles, a los santos\ny a ustedes, hermanos,\nque intercedan por mí ante Dios, nuestro Señor.',m:'Se reza en el acto penitencial. «Omisión» es lo bueno que dejamos de hacer. El golpe de pecho acompaña a «por mi culpa».'},
{id:'contri',n:'Acto de contrición',t:'Señor mío, Jesucristo,\nDios y hombre verdadero,\nCreador, Padre y Redentor mío:\npor ser Tú quien eres, bondad infinita,\ny porque te amo sobre todas las cosas,\nme pesa de todo corazón haberte ofendido.\nAyudado de tu divina gracia,\npropongo firmemente nunca más pecar,\nconfesarme y cumplir la penitencia que me fuere impuesta.\nAmén.',m:'Se reza en la confesión y por la noche. Contrición perfecta es el dolor por amor a Dios; tiene como fruto el propósito de enmendarse. Versión breve: «Jesús, ten piedad de mí, que soy pecador».'},
{id:'angelus',n:'Ángelus',t:'V. El ángel del Señor anunció a María.\nR. Y concibió por obra del Espíritu Santo.\n(Dios te salve, María…)\nV. He aquí la esclava del Señor.\nR. Hágase en mí según tu palabra.\n(Dios te salve, María…)\nV. Y el Verbo se hizo carne.\nR. Y habitó entre nosotros.\n(Dios te salve, María…)\nV. Ruega por nosotros, santa Madre de Dios.\nR. Para que seamos dignos de alcanzar las promesas de nuestro Señor Jesucristo.\n\nOremos: Derrama, Señor, tu gracia en nuestros corazones, para que quienes hemos conocido, por el anuncio del ángel, la encarnación de tu Hijo Jesucristo, lleguemos, por su pasión y su cruz, a la gloria de la resurrección. Por el mismo Jesucristo, nuestro Señor. Amén.',m:'Se reza al amanecer, al mediodía (12:00) y al atardecer. Recuerda la Encarnación. En el tiempo de Pascua se sustituye por el Regina Caeli.'},
{id:'salve',n:'Salve',t:'Dios te salve, Reina y Madre de misericordia,\nvida, dulzura y esperanza nuestra; Dios te salve.\nA ti llamamos los desterrados hijos de Eva;\na ti suspiramos, gimiendo y llorando\nen este valle de lágrimas.\nEa, pues, Señora, abogada nuestra,\nvuelve a nosotros esos tus ojos misericordiosos;\ny después de este destierro,\nmuéstranos a Jesús, fruto bendito de tu vientre.\n¡Oh clemente, oh piadosa, oh dulce Virgen María!\nRuega por nosotros, santa Madre de Dios,\npara que seamos dignos de alcanzar\nlas promesas de nuestro Señor Jesucristo. Amén.',m:'Se reza al terminar el Rosario. Es una oración antigua de súplica a María, nuestra madre y abogada.'},
{id:'ofrec',n:'Ofrecimiento del día',t:'Señor, te ofrezco este día:\nmis pensamientos, mis palabras, mi trabajo,\nmis alegrías y mis cansancios.\nQue todo lo que haga hoy sea para tu gloria\ny para el bien de las personas que me rodean.\nAmén.',m:'Oración sencilla para empezar el día. Puedes decirla con tus palabras. Existe también el ofrecimiento tradicional del Apostolado de la Oración.'},
{id:'comida',n:'Bendición de los alimentos',t:'Bendícenos, Señor,\ny bendice estos alimentos que vamos a tomar,\npor Cristo nuestro Señor. Amén.',m:'Dar gracias antes de comer nos recuerda que todo es don. Al final: «Te damos gracias, Señor, por estos alimentos».'},
{id:'guarda',n:'Ángel de la guarda',t:'Ángel de la guarda,\ndulce compañía,\nno me desampares\nni de noche ni de día.\nHasta que me pongas\nen paz y alegría\ncon todos los santos,\nJesús, José y María.',m:'Oración tradicional para los niños y para toda la familia, especialmente antes de dormir.'},
{id:'comesp',n:'Comunión espiritual',t:'Creo, Jesús mío, que estás real y verdaderamente\nen el cielo y en el Santísimo Sacramento del altar.\nTe amo sobre todas las cosas\ny deseo recibirte en mi alma.\nYa que ahora no puedo recibirte sacramentalmente,\nven al menos espiritualmente a mi corazón.\nComo si ya hubieras venido, te abrazo y me uno todo a Ti;\nno permitas que jamás me separe de Ti.',m:'Para cuando no puedes comulgar (por ejemplo, si no estás en gracia, estás enfermo o no puedes ir a Misa). Se atribuye a san Alfonso María de Ligorio.'},
{id:'anima',n:'Alma de Cristo (Anima Christi)',t:'Alma de Cristo, santifícame.\nCuerpo de Cristo, sálvame.\nSangre de Cristo, embriágame.\nAgua del costado de Cristo, lávame.\nPasión de Cristo, confórtame.\n¡Oh, buen Jesús!, óyeme.\nDentro de tus llagas, escóndeme.\nNo permitas que me aparte de ti.\nDel maligno enemigo, defiéndeme.\nEn la hora de mi muerte, llámame.\nY mándame ir a ti,\npara que con tus santos te alabe\npor los siglos de los siglos. Amén.',m:'Oración muy antigua, ideal para después de comulgar.'},
{id:'miseric',n:'Coronilla de la Divina Misericordia',t:'Empieza con: Padre Nuestro, Ave María y Credo.\n\nEn las cuentas grandes:\nPadre Eterno, te ofrezco el Cuerpo y la Sangre,\nel Alma y la Divinidad\nde tu amadísimo Hijo, nuestro Señor Jesucristo,\nen expiación de nuestros pecados y los del mundo entero.\n\nEn las diez cuentas pequeñas (cada decena):\nPor su dolorosa pasión,\nten misericordia de nosotros y del mundo entero.\n\nAl final (tres veces):\nSanto Dios, Santo Fuerte, Santo Inmortal,\nten piedad de nosotros y del mundo entero.',m:'Se reza tradicionalmente a las 3 p. m., la hora de la muerte de Jesús. Viene de las revelaciones de santa Faustina Kowalska.'}
];

/* ===== CALENDARIO LITÚRGICO (calculado) ===== */
function easter(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
  h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
  mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  return new Date(y,mo-1,da);
}
function adventStart(y){const x=new Date(y,11,24);x.setDate(24-x.getDay());return addDays(x,-21)}
function baptism(y){const j=new Date(y,0,6);return addDays(j,7-j.getDay())}
function cicloDom(d){const y=d.getFullYear();const Y=d>=adventStart(y)?y:y-1;return 'ABC'[Y%3]}
function cicloSem(d){return d.getFullYear()%2===0?'II':'I'}
const COL_FIJA={'6-29':'rojo','11-2':'morado'};

function liturgia(d){
  const y=d.getFullYear(),E=easter(y),ash=addDays(E,-46),pent=addDays(E,49),adv=adventStart(y),bap=baptism(y),ck=addDays(adv,-7);
  const wd=d.getDay(),nm=cap(DIAS[wd]),k=diff(d,E);
  let r;
  if(d>=new Date(y,11,25)){
    r={tiempo:'Navidad',color:'blanco',titulo:'Octava de Navidad'};
    if(d.getDate()===25)r.titulo='Natividad del Señor (Navidad)';
    else if(wd===0)r.titulo='Fiesta de la Sagrada Familia';
    else r.titulo=nm+' de la Octava de Navidad';
  }else if(d<=bap){
    r={tiempo:'Navidad',color:'blanco',titulo:nm+' del tiempo de Navidad'};
    if(d.getMonth()===0&&d.getDate()===1)r.titulo='Santa María, Madre de Dios';
    else if(ymd(d)===ymd(bap))r.titulo='Bautismo del Señor';
    else if(d.getMonth()===0&&d.getDate()===6)r.titulo='Epifanía del Señor';
    else if(wd===0&&d.getDate()<=5)r.titulo='Domingo II de Navidad';
  }else if(d>=adv){
    const w=Math.floor(diff(d,adv)/7)+1;
    r={tiempo:'Adviento',color:'morado',semana:w};
    if(wd===0){r.titulo='Domingo '+ROM[w]+' de Adviento';if(w===3){r.color='rosa';r.nota='Domingo Gaudete («alégrense»): se puede usar el color rosa.'}}
    else if(d.getMonth()===11&&d.getDate()>=17)r.titulo=nm+' '+d.getDate()+' de diciembre, preparación inmediata a la Navidad';
    else r.titulo=nm+' de la semana '+w+' de Adviento';
  }else if(d<ash){
    const s=addDays(d,-wd),N=Math.round(diff(s,bap)/7)+1;
    r={tiempo:'Tiempo Ordinario',color:'verde',semana:N,titulo:(wd===0?'Domingo '+(N)+' del Tiempo Ordinario':nm+' de la semana '+N+' del Tiempo Ordinario')};
  }else if(k<-3){
    r={tiempo:'Cuaresma',color:'morado'};
    const first=addDays(ash,4);
    if(diff(d,ash)===0)r.titulo='Miércoles de Ceniza';
    else if(d<first)r.titulo=nm+' después de Ceniza';
    else if(k===-7){r.titulo='Domingo de Ramos de la Pasión del Señor';r.color='rojo'}
    else if(k>=-6){r.titulo=nm+' Santo';r.semana=0}
    else{
      const s=addDays(d,-wd),w=Math.round(diff(s,first)/7)+1;r.semana=w;
      if(wd===0){r.titulo='Domingo '+ROM[w]+' de Cuaresma';if(w===4){r.color='rosa';r.nota='Domingo Laetare («alégrate»): se puede usar el color rosa.'}}
      else r.titulo=nm+' de la semana '+w+' de Cuaresma';
    }
  }else if(k<0){
    r={tiempo:'Triduo Pascual',color:'blanco'};
    if(k===-3)r.titulo='Jueves Santo, Cena del Señor';
    else if(k===-2){r.titulo='Viernes Santo, Pasión del Señor';r.color='rojo'}
    else r.titulo='Sábado Santo, Vigilia Pascual por la noche';
  }else if(d<=pent){
    r={tiempo:'Pascua',color:'blanco'};
    if(k===0)r.titulo='Domingo de Resurrección';
    else if(k<7)r.titulo=nm+' de la Octava de Pascua';
    else if(k===49){r.titulo='Domingo de Pentecostés';r.color='rojo'}
    else if(wd===0){r.titulo='Domingo '+ROM[k/7+1]+' de Pascua';if(k===7)r.nota='Domingo de la Divina Misericordia.'}
    else r.titulo=nm+' de la semana '+(Math.floor(k/7)+1)+' de Pascua';
    if(k===39)r.nota='Ascensión del Señor (en muchos países se celebra el domingo siguiente).';
  }else{
    const s=addDays(d,-wd),N=34-Math.round(diff(ck,s)/7);
    r={tiempo:'Tiempo Ordinario',color:'verde',semana:N};
    if(ymd(d)===ymd(ck)){r.titulo='Solemnidad de Cristo Rey del Universo';r.color='blanco'}
    else r.titulo=(wd===0?'Domingo '+N+' del Tiempo Ordinario':nm+' de la semana '+N+' del Tiempo Ordinario');
    if(k===56)r.nota='Solemnidad de la Santísima Trinidad.';
    if(k===60)r.nota='Corpus Christi (en muchos países se celebra el domingo siguiente).';
    if(k===63)r.nota='En muchos países hoy se celebra el Corpus Christi.';
    if(k===68)r.nota='Solemnidad del Sagrado Corazón de Jesús.';
  }
  if(r.tiempo!=='Triduo Pascual'&&!(r.tiempo==='Cuaresma'&&k>=-6&&k<0)){
    const f=FIJAS.find(x=>x[0]===d.getMonth()+1&&x[1]===d.getDate());
    if(f){
      r.especial={n:f[2],g:f[3],d:f[4]};r.color=COL_FIJA[(d.getMonth()+1)+'-'+d.getDate()]||'blanco';
      if(wd!==0||r.tiempo==='Tiempo Ordinario'||r.tiempo==='Navidad')r.titulo=f[2];
    }
  }
  return r;
}

function deck(){
  const c=[];
  DIALOGOS.forEach((x,i)=>c.push({id:'d'+i,k:'d',q:'El celebrante dice: «'+x.p+'». ¿Qué respondemos?',a:x.r,pool:DIALOGOS.map(y=>y.r),por:x.por}));
  ORDEN.forEach((n,i)=>{if(i<ORDEN.length-1)c.push({id:'o'+i,k:'o',q:'¿Qué parte viene justo después de «'+n+'»?',a:ORDEN[i+1],pool:ORDEN.filter(m=>m!==n),por:'Después de «'+n+'» viene «'+ORDEN[i+1]+'».'})});
  GLOS.forEach((g,i)=>c.push({id:'g'+i,k:'g',q:'¿Qué significa «'+g.t+'»?',a:g.d,pool:GLOS.map(y=>y.d),por:'«'+g.t+'»: '+g.d}));
  FACTOS.forEach((f,i)=>c.push({id:'f'+i,k:'f',q:f.q,a:f.a,fixed:f.o,por:f.por}));
  return c;
}
const DECK=deck();
function optsFor(c){
  if(c.fixed)return shuffle([c.a].concat(c.fixed));
  const pool=Array.from(new Set(c.pool)).filter(x=>x!==c.a);
  return shuffle([c.a].concat(shuffle(pool).slice(0,3)));
}
function nextCard(){
  const box=store.get('box',{}),cards=DECK.filter(c=>state.qf==='all'||c.k===state.qf);
  const cand=cards.filter(c=>!state.q||c.id!==state.q.c.id);
  const w=cand.map(c=>1/Math.pow(1+(box[c.id]||0),2));
  let r=Math.random()*w.reduce((a,b)=>a+b,0),i=0;
  for(;i<cand.length-1;i++){r-=w[i];if(r<=0)break}
  const c=cand[i];state.q={c,opts:optsFor(c),pick:null};
}
function quizHtml(){
  const box=store.get('box',{}),all=DECK.length,learned=DECK.filter(c=>(box[c.id]||0)>=3).length;
  if(!state.q)nextCard();
  const q=state.q;
  let h='<div class="card"><div class="small mut">Dominadas: '+learned+' de '+all+'</div><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+all+'" aria-valuenow="'+learned+'"><i style="width:'+Math.round(learned/all*100)+'%"></i></div>'+
  '<p class="q">'+esc(q.c.q)+'</p>';
  q.opts.forEach((o,i)=>{
    let cls='opt';
    if(q.pick!==null){if(o===q.c.a)cls+=' ok';else if(i===q.pick)cls+=' bad'}
    h+='<button class="'+cls+'" data-act="ans" data-i="'+i+'"'+(q.pick!==null?' disabled':'')+'>'+esc(o)+'</button>';
  });
  if(q.pick!==null){
    h+='<p><b>'+(q.opts[q.pick]===q.c.a?'¡Correcto!':'No exactamente.')+'</b> '+esc(q.c.por||'')+'</p><div class="row"><button class="btn" data-act="next">Siguiente</button></div>';
  }
  return h+'</div>';
}

function rutDone(){const r=store.get('rut',{});return r[ymd(new Date())]||[]}
function streak(){
  const r=store.get('rut',{});let n=0,d=new Date();const ok=x=>(r[ymd(x)]||[]).length>=3;
  if(!ok(d))d=addDays(d,-1);
  while(ok(d)){n++;d=addDays(d,-1)}
  return n;
}

function prevTue(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const k=(x.getDay()-2+7)%7;return addDays(x,-(k===0?7:k))}

function composeShare(cita,n){
  const p=[];
  if(n.palabra)p.push('Del Evangelio de hoy ('+cita+') me tocó: '+n.palabra.trim());
  if(n.luz)p.push('Lo que siento que Dios me dice: '+n.luz.trim());

function misaHoy(){
  const t=new Date(),L=liturgia(t),H=window.HOY,ok=!!(H&&H.fecha===ymd(t)),M=(ok&&H.misa)||{};
  const dom=t.getDay()===0,g=L.especial?L.especial.g:'',sol=/Solemnidad/i.test(g)||/Solemnidad/.test(L.titulo||'')||/Solemnidad/.test(L.nota||''),fie=/Fiesta/i.test(g);
  const penit=L.tiempo==='Adviento'||L.tiempo==='Cuaresma';
  const lec=k=>ok&&H.lecturas?H.lecturas.find(l=>l.tipo===k):null;
  const ev=lec('Evangelio');
  return {ok,L,M,
    titulo:M.celebracion||(ok&&H.titulo)||L.titulo,
    rango:M.rango||(sol?'Solemnidad':fie?'Fiesta':dom?'Domingo':''),
    color:M.color||L.color,
    gloria:typeof M.gloria==='boolean'?M.gloria:((dom&&!penit)||sol||fie),
    credo:typeof M.credo==='boolean'?M.credo:(dom||sol),
    segunda:typeof M.segunda==='boolean'?M.segunda:(ok?!!lec('Segunda lectura'):(dom||sol)),
    cuaresma:L.tiempo==='Cuaresma'||L.tiempo==='Triduo Pascual',
    l1:lec('Primera lectura'),sal:lec('Salmo responsorial'),l2:lec('Segunda lectura'),ev,
    salResp:M.salmo&&M.salmo.respuesta||'',
    evIntro:M.evangelioIntro||(ev?'Lectura del santo Evangelio según '+evSegun(ev.cita):''),
    relato:M.relato||null,

function evSegun(c){const m=(c||'').match(/^(Mateo|Marcos|Lucas|Juan)/i);return m?'san '+cap(m[1].toLowerCase()):'san…'}
function guiaPasos(){
  const D=misaHoy(),L=[{intro:true,s:'Antes de empezar',p:{n:'La Misa de hoy'}}];
  MISA.forEach(s=>s.partes.forEach(p=>{
    let skip='';

const YO=r=>/^(Pueblo|Todos|Tú)$/.test(r);
function dialogo(p,D,compact){

    h+=rosMap(bead)+'<h2 style="margin-top:6px">'+esc(p.t)+'</h2><span class="where">👉 '+esc(p.w)+'</span>'+p.b;
    if(p.say)h+='<div class="row" style="margin:6px 0">'+sayBtn('r_'+p.say,oraT(p.say).replace(/\n/g,' '))+'</div>';
    if(n){
      h+='<div class="beads" aria-hidden="true">'+Array.from({length:n},(_,j)=>'<i class="'+(j<c?'on':'')+'"></i>').join('')+'</div>';

/* Motor de desplazamiento: calcula cuánto de cada imagen se ve y mueve zoom, recorte, paralaje y textos. */
let feTick=false;
const cl=(x,a,b)=>Math.max(a,Math.min(b,x));
function feFrame(){
  feTick=false;const vh=innerHeight,de=document.documentElement;
  const pr=$('#prog');if(pr)pr.style.setProperty('--sp',(scrollY/Math.max(1,de.scrollHeight-vh)).toFixed(4));
  if(RM())return;
  document.querySelectorAll('.ph').forEach(el=>{const h=el.offsetHeight||1;el.style.setProperty('--k',cl(scrollY/h,0,1).toFixed(4))});
  document.querySelectorAll('.fe').forEach(el=>{
    const r=el.getBoundingClientRect();if(r.bottom<-50||r.top>vh+50)return;
    const en=cl((vh-r.top)/(vh*.7),0,1),p=cl((vh-r.top)/(vh+r.height),0,1);
    el.style.setProperty('--c',((1-en)*9).toFixed(2));
    el.style.setProperty('--s',(1.22-.22*en).toFixed(4));
    el.style.setProperty('--y',((p-.5)*-14).toFixed(2));
    el.style.setProperty('--o',cl((en-.5)/.4,0,1).toFixed(3));
  });
  document.querySelectorAll('.story').forEach(st=>{
    const r=st.getBoundingClientRect();if(r.bottom<0||r.top>vh)return;
    const ls=st.querySelectorAll('.ly'),n=ls.length,p=cl(-r.top/Math.max(1,r.height-vh),0,1),x=p*n;
    const sol=st.querySelector('.sol');
    if(sol){sol.style.setProperty('--hs',(.95+.35*p).toFixed(4));sol.style.setProperty('--hr',(p*140).toFixed(2)+'deg');sol.style.opacity=(1-cl((x-(n-.6))/.5,0,1)).toFixed(3)}
    ls.forEach((l,i)=>{
      const t=x-i; /* 0→1 mientras esta escena es la protagonista */
      const grow=cl(t/.45,0,1),gone=cl((t-1)/.35,0,1),last=i===n-1;
      const rad=last?(19+81*cl((t-.4)/.5,0,1)):19*grow;
      l.style.setProperty('--r',(t<=0?0:rad*(last?1:1-gone)).toFixed(2)+'%');
      l.style.setProperty('--s',(1.25-.2*cl(t,0,1)).toFixed(4));
      l.style.setProperty('--y','0');
      const im=l.querySelector('img');if(im&&im.naturalWidth){const W=innerWidth,Hb=vh*1.12,ar=im.naturalWidth/im.naturalHeight,h=ar>W/Hb?Hb:W/ar,top=-vh*.06+(Hb-h)/2,fy=+im.dataset.fy||.5,sc=1.25-.2*cl(t,0,1),c=vh*.5,face=c+sc*(top+fy*h-c),want=vh*.44;
        l.style.setProperty('--sh',(last&&t>.6?(want-face)*cl(1-(t-.6)/.4,0,1):want-face).toFixed(1)+'px')}
      l.style.setProperty('--o',(t<=0||(!last&&t>=1.25)?0:cl(Math.min((t-.15)/.3,(last?9:(1.15-t)/.25)),0,1)).toFixed(3));
      l.style.zIndex=1+i});
    st.querySelectorAll('.pips i').forEach((d,i)=>d.classList.toggle('on',Math.min(n-1,Math.floor(x))===i));
  });
}

const IO=('IntersectionObserver' in window)?new IntersectionObserver(es=>es.forEach(en=>{
  const el=en.target;
  if(en.isIntersecting&&(en.intersectionRatio>=.12||en.boundingClientRect.height>innerHeight*.8)){el.classList.add('vis')}
  else if(!en.isIntersecting){el.classList.remove('vis');el.classList.toggle('up',en.boundingClientRect.top<0)}
}),{threshold:[0,.12]}):null;
function reveal(){
  if(!IO||RM())return;
  IO.disconnect();
  const mark=par=>{for(const el of par.children){
    if(el.matches('.seg,script,style,[hidden],.fe,.story,.ph'))continue;
    const r=el.getBoundingClientRect();
    if(r.height>innerHeight*.9&&el.children.length>1&&!el.matches('details')){mark(el);continue}
    if(r.top<innerHeight&&r.bottom>0)continue;
    el.classList.add('rv');if(r.bottom<=0)el.classList.add('up');IO.observe(el);
  }};
  mark($('#main'));
}

document.addEventListener('click',e=>{
  const s=e.target.closest('summary');if(!s||RM())return;
  const d=s.parentElement;if(!d||d.tagName!=='DETAILS'||!d.animate)return;
  e.preventDefault();
  if(d._a){d._a.cancel()}
  const opening=!d.open||d._closing;
  const from=d.offsetHeight;
  d._closing=false;d.style.overflow='hidden';
  let to;
  if(opening){d.open=true;d.style.height='auto';to=d.offsetHeight}
  else{to=s.offsetHeight+(d.offsetHeight-d.clientHeight);d._closing=true}
  const a=d.animate({height:[from+'px',to+'px']},{duration:opening?300:240,easing:'cubic-bezier(.2,.7,.2,1)'});
  const inn=d.querySelector(':scope>.in');
  if(opening&&inn&&inn.animate)inn.animate({opacity:[0,1],transform:['translateY(-6px)','none']},{duration:300,easing:'ease-out'});
  d._a=a;
  a.onfinish=()=>{if(d._closing){d.open=false;d._closing=false}d.style.overflow='';d.style.height='';d._a=null};
  a.oncancel=()=>{d.style.overflow='';d.style.height=''};
});

  document.querySelectorAll('[data-act="speak"]').forEach(b=>b.textContent='Escuchar');

function speak(id,btn){
  if(!TTS)return;
  if(state.speaking===id){stopSpeak();return}
  stopSpeak();
  const u=new SpeechSynthesisUtterance(state.say[id]||'');
  u.lang='es-419';u.rate=.95;
  try{const v=speechSynthesis.getVoices().find(x=>/^es/i.test(x.lang));if(v)u.voice=v}catch(e){}
  u.onend=u.onerror=()=>{if(state.speaking===id){state.speaking=null;btn.textContent='Escuchar'}};
  state.speaking=id;btn.textContent='Detener';
  speechSynthesis.speak(u);
}

function hoyViejo(){const H=window.HOY;return !(H&&H.fecha===ymd(new Date()))}
async function nuevoDia(){state.day=ymd(new Date());state.year=new Date().getFullYear();state.nov=null;render();if(hoyViejo()){await cargarHoy();if(!hoyViejo())render(true)}}
(function medianoche(){const t=new Date(),m=new Date(t.getFullYear(),t.getMonth(),t.getDate()+1,0,0,5);setTimeout(()=>{nuevoDia();medianoche()},m-t)})();
/* Mientras el Evangelio de hoy no esté publicado, se vuelve a buscar cada 10 minutos (la actualización se hace pasada la medianoche). */
setInterval(async()=>{if(!document.hidden&&hoyViejo()){await cargarHoy();if(!hoyViejo())render(true)}},10*60*1000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;if(ymd(new Date())!==state.day)nuevoDia();else if(hoyViejo())cargarHoy().then(()=>{if(!hoyViejo())render(true)})});
render();
})();
</script>

<script>if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}</script>
